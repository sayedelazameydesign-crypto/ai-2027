[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai2027-protocol"
version = "0.1.0"
description = "Python 2027 Engineering Protocol reference scaffold, Free-First AI router, and repo auditor ($0 Workers & Colab ready)."
readme = "README.md"
# Note: Primary CI & target standard is Python 3.13+; >=3.11 ensures immediate
# execution across Google Colab, Pyodide Workers, and Debian/Ubuntu hosts.
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AI-2027 Contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  # NOTE: kernel-2027 is deliberately NOT a declared dependency here.
  # It is stdlib-only and sits in the same repository, so
  # `ai2027_protocol/_kernel_path.py` makes it importable from a checkout with
  # no install. Declaring it would force a uv.lock regeneration and a PyPI
  # lookup for a package that is not published — cost with no benefit.
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "pydantic>=2.9,<3",
  "structlog>=24.4,<27",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.115",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
ai2027-py27 = "ai2027_protocol.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai2027_protocol"]
artifacts = ["src/ai2027_protocol/static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "workers/python-worker/src"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "ANN",
  "ASYNC",
  "S",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D400",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "ANN", "D100", "D101", "D102", "D103", "D104", "D400"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_unreachable = true
mypy_path = ["src", "workers/python-worker/src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers --cov=src/ai2027_protocol --cov=workers/python-worker/src --cov-report=term-missing"

[tool.coverage.run]
source = ["src/ai2027_protocol", "workers/python-worker/src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
