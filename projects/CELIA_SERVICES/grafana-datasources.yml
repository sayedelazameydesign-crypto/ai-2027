apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s
      httpMethod: POST
    
  - name: Agent Metrics
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: agent-metrics
    jsonData:
      timeInterval: 5s
      queryTimeout: 30s
      httpMethod: POST
      customQueryParameters: 'step=5s' 

  - name: System Metrics
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: system-metrics
    jsonData:
      timeInterval: 10s
      queryTimeout: 60s
      httpMethod: POST