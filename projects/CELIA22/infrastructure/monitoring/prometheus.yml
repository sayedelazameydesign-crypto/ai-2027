global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'celia-fashion'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Docker containers
  - job_name: 'docker'
    static_configs:
      - targets: ['172.17.0.1:9323']

  # AL-Agent
  - job_name: 'al-agent'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['al-agent:8000']

  # Traefik
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']

  # Postgres Exporter (if installed)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis Exporter (if installed)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
