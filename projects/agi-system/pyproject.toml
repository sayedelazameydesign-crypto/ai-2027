[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-kernel"
version = "0.3.0"
description = "Dependency-free AGI kernel with a verified cognitive loop, append-only event ledger, and exact bounded integer optimizer"
readme = "README.md"
requires-python = ">=3.10"
# LICENSE PENDING — see docs/LICENSE-DECISIONS.md. The repository-root MIT
# LICENSE covers first-party components only, never the 48 imported projects.
# Do NOT publish to PyPI until the owner decides a license for this project.
license = {text = "UNLICENSED — all rights reserved, pending owner decision"}
authors = [{ name = "sayedelazameydesign-crypto" }]
keywords = ["agi", "agent", "kernel", "verification", "event-sourcing", "sandbox"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
agi-kernel = "core.cli:main"

[tool.setuptools]
packages = ["core"]

[tool.setuptools.package-data]
core = ["py.typed"]
