# Render blueprint — AI-2027 live demo
#
# The version proposed earlier in chat did not parse. It had a list item that was
# only `- type: web` and put every other key under a SECOND list item, so the
# YAML produced two services: one with no name/command, one with no type. Verified
# with PyYAML before writing this file.
#
# The start command is also corrected: `python3 -m live_agent.server` cannot work,
# there is no `live_agent` package (measured: ModuleNotFoundError). The server is
# `live-agent/server.py`, which is not importable as a module path, so the
# launcher in deployment/ loads it explicitly.
# No persistent disk is configured by this free blueprint: non-destructive startup
# preserves files across process restarts only while the same instance filesystem remains.
# Replacements/redeploys are NOT a durability guarantee; no paid/external storage is provisioned.
services:
  - type: web
    name: ai-2027-live-agent
    runtime: python
    region: frankfurt
    plan: free
    # No third-party dependency: the project is stdlib-only by construction and
    # CI fails if that ever stops being true (scripts/ci_guard.py imports).
    buildCommand: ""
    startCommand: "python3 deployment/live_server.py"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render injects PORT itself; the launcher reads it.
      - key: AI2027_MAX_DISK_MB
        value: "256"
      - key: AI2027_MAX_RUNS
        value: "5000"
      - key: AI2027_WRITE_RATE_LIMIT
        value: "10"
      - key: AI2027_WRITE_RATE_WINDOW_SECONDS
        value: "60"
      # Public blueprint is read-only. No write secret is stored in this file.
      # Only an operator-managed secret plus an explicit override can enable writes.
      - key: AI2027_READ_ONLY
        value: "1"

  # The Agent Studio web UI and its API, served from ONE origin.
  #
  # studio.html is served by the FastAPI application itself at /studio, and it
  # calls /v1/studio/* with relative paths. The UI and the API are therefore
  # the same origin: no proxy, no CORS headers and no browser-bundled
  # credential are involved, and the default browser same-origin policy
  # applies unchanged.
  #
  # This service does install the package, unlike the live-agent service
  # above: the Studio API needs fastapi, httpx, uvicorn and pydantic. The two
  # services stay separate on purpose - the live-agent path must remain
  # stdlib-only, and scripts/ci_guard.py fails CI if that ever changes.
  - type: web
    name: ai-2027-studio
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -e python-2027"
    startCommand: "ai2027-py27 studio --host 0.0.0.0 --port $PORT"
    # The status route reports readiness and the presence of provider
    # credentials. It never reports a credential value, so it is safe to use
    # as a liveness probe.
    healthCheckPath: /v1/studio/status
    autoDeploy: true
    envVars:
      # Render injects PORT itself.
      - key: AI2027_READ_ONLY
        value: "1"
      # A public instance must never spend. This authorises no paid request;
      # with no budget, every paid and unknown-cost call is refused.
      - key: AI2027_MAX_SPEND_USD
        value: "0"
      # Secrets are entered once in the Render dashboard (sync: false) and
      # are never stored in Git. Each one has a real consumer: the Studio
      # status route reports configured true/false, and the connectors
      # catalog route reports token_missing when it is absent.
      - key: OPENROUTER_API_KEY
        sync: false
      # The model id the Studio routes OpenRouter calls to.
      #
      # Declared as a dashboard secret so the free model can be changed
      # without a code change or a re-deploy of the repository. The value is
      # NOT a secret in the secrecy sense - it is an operator choice that must
      # not be committed, because a committed id would silently become the
      # default for every deployment of this blueprint.
      #
      # Only a genuinely free id is safe here:
      #   * "openrouter/free"  - the dynamic free router (recommended), or
      #   * "<vendor>/<model>:free" - an explicitly free pinned model.
      # Any other id (a paid model, "openrouter/auto", or a "~latest"
      # alias) is classified UNKNOWN_COST and is refused under
      # AI2027_MAX_SPEND_USD=0 above. Leaving this blank is also safe: the
      # provider falls back to the "openrouter/free" default.
      - key: OPENROUTER_MODEL
        sync: false
      - key: CONNECTORS_HUB_API_TOKEN
        sync: false
