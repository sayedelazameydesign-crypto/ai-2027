<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" role="img" aria-labelledby="title desc">
  <title id="title">CELIA Skill Factory — Phase 1 architecture</title>
  <desc id="desc">Draft lifecycle with its own event log and anchor, an evidence bundle hashed per file and as a bundle, and a release gate that refuses release unless tests, evidence, human approval and zero blockers all hold.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .t { font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
      .h { font-size: 20px; font-weight: 700; fill: #1a202c; }
      .sub { font-size: 12px; fill: #4a5568; }
      .box-t { font-size: 12.5px; font-weight: 600; fill: #1a202c; }
      .sm { font-size: 10.5px; fill: #4a5568; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; fill: #2d3748; }
      .lane { fill: #ffffff; stroke: #cbd5e0; stroke-width: 1; }
      .draft { fill: #ebf8ff; stroke: #2b6cb0; stroke-width: 1.4; }
      .rel { fill: #f0fff4; stroke: #2f855a; stroke-width: 1.4; }
      .gate { fill: #fffaf0; stroke: #b7791f; stroke-width: 1.6; }
      .blk { fill: #fff5f5; stroke: #c53030; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .gate-bad { fill: #fff5f5; stroke: #c53030; stroke-width: 1; }
      .gate-ok { fill: #f0fff4; stroke: #2f855a; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1100" height="720" fill="#f7fafc"/>
  <text class="t h" x="40" y="42">CELIA Skill Factory — Phase 1</text>
  <text class="t sub" x="40" y="62">Design verified by 56 executing tests · no factory engine · no execution path</text>

  <!-- LANE: drafts -->
  <rect class="lane" x="40" y="90" width="1020" height="196" rx="8"/>
  <text class="t box-t" x="58" y="114">Draft lifecycle</text>
  <text class="t sm" x="58" y="132">own log · own anchor · never writes to the release log</text>

  <g class="t">
    <rect class="draft" x="60" y="150" width="104" height="42" rx="6"/>
    <text class="box-t" x="82" y="176">DRAFT</text>

    <rect class="draft" x="212" y="150" width="116" height="42" rx="6"/>
    <text class="box-t" x="228" y="176">SUBMITTED</text>

    <rect class="draft" x="376" y="150" width="112" height="42" rx="6"/>
    <text class="box-t" x="395" y="176">IN_REVIEW</text>

    <rect class="draft" x="536" y="150" width="112" height="42" rx="6"/>
    <text class="box-t" x="556" y="176">APPROVED</text>

    <rect class="draft" x="696" y="150" width="112" height="42" rx="6"/>
    <text class="box-t" x="712" y="176">PUBLISHED</text>

    <rect class="draft" x="376" y="228" width="152" height="38" rx="6"/>
    <text class="sm" x="391" y="252">CHANGES_REQUESTED</text>

    <rect class="draft" x="876" y="150" width="112" height="42" rx="6"/>
    <text class="box-t" x="895" y="176">ABANDONED</text>
  </g>

  <g stroke="#4a5568" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <line x1="164" y1="171" x2="206" y2="171"/>
    <line x1="328" y1="171" x2="370" y2="171"/>
    <line x1="488" y1="171" x2="530" y2="171"/>
    <line x1="648" y1="171" x2="690" y2="171"/>
    <path d="M 432 192 L 432 222"/>
    <path d="M 452 222 L 452 196"/>
    <path d="M 832 171 L 870 171"/>
  </g>
  <text class="t sm" x="176" y="205">submit</text>
  <text class="t sm" x="338" y="205">queue</text>
  <text class="t sm" x="498" y="205">approve</text>

  <!-- LANE: evidence -->
  <rect class="lane" x="40" y="306" width="1020" height="150" rx="8"/>
  <text class="t box-t" x="58" y="330">Evidence bundle</text>
  <text class="t sm" x="58" y="348">hashed per file, then hashed as a bundle · order-independent</text>

  <g class="t">
    <rect class="rel" x="60" y="364" width="150" height="34" rx="5"/>
    <text class="mono" x="74" y="386">tests.log</text>
    <rect class="rel" x="60" y="404" width="150" height="34" rx="5"/>
    <text class="mono" x="74" y="426">coverage.json</text>

    <rect class="rel" x="238" y="364" width="150" height="34" rx="5"/>
    <text class="mono" x="252" y="386">review.md</text>
    <rect class="rel" x="238" y="404" width="150" height="34" rx="5"/>
    <text class="mono" x="252" y="426">SKILL.md</text>

    <rect class="draft" x="424" y="384" width="182" height="46" rx="6"/>
    <text class="sm" x="440" y="404">sha256 per file</text>
    <text class="sm" x="440" y="421">→ sorted manifest</text>

    <rect class="draft" x="642" y="384" width="200" height="46" rx="6"/>
    <text class="sm" x="658" y="404">bundle_digest =</text>
    <text class="mono" x="658" y="421">sha256(manifest)</text>
  </g>
  <g stroke="#4a5568" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <line x1="210" y1="381" x2="234" y2="381"/>
    <line x1="388" y1="381" x2="420" y2="390"/>
    <line x1="606" y1="407" x2="638" y2="407"/>
  </g>

  <!-- LANE: release -->
  <rect class="lane" x="40" y="472" width="1020" height="196" rx="8"/>
  <text class="t box-t" x="58" y="496">Release gate and log</text>
  <text class="t sm" x="58" y="514">all conditions must hold · every blocker reported together</text>

  <g class="t">
    <rect class="gate" x="60" y="536" width="196" height="112" rx="7"/>
    <text class="box-t" x="78" y="560">Release gate</text>
    <text class="sm" x="78" y="580">TESTS_PASSED</text>
    <text class="sm" x="78" y="596">EVIDENCE_PINNED</text>
    <text class="sm" x="78" y="612">HUMAN_APPROVED</text>
    <text class="sm" x="78" y="628">NO_BLOCKED</text>
    <text class="sm" x="78" y="644">APPROVAL_NOT_IN_LOG</text>

    <rect class="gate-bad" x="296" y="536" width="168" height="46" rx="6"/>
    <text class="box-t" x="314" y="557">RELEASE_BLOCKED</text>
    <text class="sm" x="314" y="573">gate refused · no event written</text>

    <rect class="gate-ok" x="296" y="602" width="168" height="46" rx="6"/>
    <text class="box-t" x="314" y="623">RELEASE emitted</text>
    <text class="sm" x="314" y="639">appended to the log</text>

    <rect class="rel" x="520" y="536" width="238" height="112" rx="7"/>
    <text class="box-t" x="536" y="560">registry.events.jsonl</text>
    <text class="mono" x="536" y="580">sequence</text>
    <text class="mono" x="536" y="598">previous_event_sha256</text>
    <text class="mono" x="536" y="616">event_sha256</text>
    <text class="sm" x="536" y="636">chain · detects edit, reorder, gap</text>

    <rect class="rel" x="792" y="536" width="196" height="52" rx="7"/>
    <text class="box-t" x="808" y="558">anchor.json</text>
    <text class="sm" x="808" y="576">(sequence, head_sha256) · outside the log</text>

    <rect class="blk" x="792" y="602" width="196" height="46" rx="7"/>
    <text class="box-t" x="808" y="622">BLOCKED</text>
    <text class="sm" x="808" y="638">rewrite of log + anchor</text>
  </g>

  <g stroke="#4a5568" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <line x1="256" y1="558" x2="292" y2="558"/>
    <line x1="256" y1="624" x2="292" y2="624"/>
    <line x1="464" y1="624" x2="516" y2="624"/>
    <line x1="758" y1="560" x2="788" y2="560"/>
  </g>
  <text class="t sm" x="272" y="552">fail</text>
  <text class="t sm" x="272" y="618">pass</text>

  <!-- no-execution band -->
  <rect class="blk" x="40" y="676" width="1020" height="30" rx="6"/>
  <text class="t sm" x="58" y="696">NO EXECUTION PATH — scripts inside a skill are inert text. No process is spawned from skill content. Engine, Nimna and kernel are out of Phase 1 scope.</text>

  <text class="t sm" x="40" y="84">Arabic/English labels follow the ADR; reason codes are the machine contract.</text>
</svg>
