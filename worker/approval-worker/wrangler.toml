# Passkey approval worker (ADR-0006) — deploy with:
#   1. wrangler kv:namespace create APPROVAL_AUTH   -> paste the id below
#   2. wrangler secret put SIGNING_PRIVATE_KEY      <- openssl genpkey -algorithm Ed25519
#   3. export the public key hex into the executor env as PA_APPROVAL_SIGNING_PUBKEY
#      (openssl pkey -in key.pem -pubout -outform DER | tail -c 32 | xxd -p -c 64)
#   4. wrangler deploy  -> set PA_APPROVAL_VOTE_BASE_URL to the https://…workers.dev origin
name = "approval-worker"
main = "src/index.js"
compatibility_date = "2026-11-01"

# No secrets in this file. SIGNING_PRIVATE_KEY lives only in Wrangler secrets.
# PA_APPROVAL_VOTE_BASE_URL / PA_APPROVAL_SIGNING_PUBKEY are set on the
# Python side (.env.example section 9), never here.

[[kv_namespaces]]
binding = "APPROVAL_AUTH"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
