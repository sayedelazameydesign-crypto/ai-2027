name: Bug report
description: Something claimed to work does not
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This repository publishes numbers. If a published number is wrong, that is
        a **P0** bug — say which file claims it.
  - type: input
    id: claim
    attributes:
      label: Which claim or command is wrong?
      placeholder: "e.g. README says 15/15, I measure 13/15"
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Exact reproduction
      description: Commands, in order, from a clean clone.
      render: bash
    validations: {required: true}
  - type: textarea
    id: observed
    attributes:
      label: Observed output
      render: text
    validations: {required: true}
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python version, commit SHA"
    validations: {required: true}
