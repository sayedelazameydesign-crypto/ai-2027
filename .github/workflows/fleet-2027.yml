# CI for fleet-2027 — the durable, evidence-verified agent fleet runtime.
#
# Three jobs, each with a *falsifiable* purpose:
#
#   1. guards     — zero third-party imports (the requirements.txt promise), no
#                   success path that bypasses the verifier, no silent `except: pass`.
#   2. unit       — the 101-test suite on 3.11 / 3.12 / 3.13. No installs: the
#                   package is stdlib-only by design, so anything that needs pip
#                   would fail here.
#   3. gate       — the twelve-gate evidence run, including a real SIGKILL of a
#                   child worker, two real OS processes on one database, and a
#                   router failover through python-2027's FreeFirstRouter. It
#                   uploads `launch/evidence/fleet-2027-gate.json` so the claim
#                   can be audited later instead of trusted.
#
# The gate job is deliberately NOT mocked or skipped on any runner: if the
# durability mechanism breaks, the workflow must go red.
name: Fleet 2027 · durable agents

on:
  push:
    branches: [main]
    paths:
      - "fleet-2027/**"
      - "scripts/fleet_guard.py"
      - "scripts/fleet_router_bridge_check.py"
      # The comparison contract and the real-model runner both live in
      # scripts/. Without them here, editing either one changes a gate that
      # the gate itself never re-runs — which is how a broken verdict ships.
      - "scripts/compare_benchmarks.py"
      - "scripts/test_compare_benchmarks.py"
      - "scripts/run_real_model.py"
      - "scripts/bench_gate.py"
      - "fleet-2027/bench/**"
      - ".github/workflows/fleet-2027.yml"
      - ".github/workflows/real-model.yml"
      - "docs/pap-2027-engines.json"
  pull_request:
    branches: [main]
    paths:
      - "fleet-2027/**"
      - "scripts/fleet_guard.py"
      - "scripts/fleet_router_bridge_check.py"
      # The comparison contract and the real-model runner both live in
      # scripts/. Without them here, editing either one changes a gate that
      # the gate itself never re-runs — which is how a broken verdict ships.
      - "scripts/compare_benchmarks.py"
      - "scripts/test_compare_benchmarks.py"
      - "scripts/run_real_model.py"
      - "scripts/bench_gate.py"
      - "fleet-2027/bench/**"
      - ".github/workflows/fleet-2027.yml"
      - ".github/workflows/real-model.yml"
      - "docs/pap-2027-engines.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-2027-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Guards · stdlib only · no unverified success path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: fleet-2027 guards
        run: python3 scripts/fleet_guard.py all
      - name: PAP-2027 gap audit must still agree with disk
        run: |
          python3 scripts/pap_gap_audit.py --assert
          python3 scripts/test_pap_gap_audit.py -v

  unit:
    # Named distinctly from ci.yml's "Tests · Python ..." on purpose. Both
    # workflows previously used the identical job name for different suites,
    # so when both were scheduled their checks were indistinguishable by name
    # - and a required status check is matched by name. This job runs the
    # fleet-2027 and kernel-2027 suites; ci.yml's runs the ai-2027 suite.
    name: Fleet & kernel tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest only (the package itself needs nothing)
        run: python -m pip install --disable-pip-version-check "pytest==8.3.4"
      - name: Unit tests (stdlib only, no package install)
        working-directory: fleet-2027
        run: python -m pytest tests -q -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      # The kernel is what every engine imports, so it is tested on every Python
      # version too — a regression here would reach the whole repository.
      - name: Kernel tests (shared primitives, stdlib only)
        working-directory: kernel-2027
        run: python -m pytest tests -q -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      # The quality ratchet: the measured score over a fixed 24-sentence corpus
      # may not go down. Deliberately in the matrix, so a scoring regression
      # shows up on every supported Python rather than only one.
      - name: Quality ratchet (fixed corpus, may not regress)
        run: python scripts/bench_gate.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      # The comparison tool can report a winner, so it gets its own tests: a
      # verdict built on two non-comparable numbers is worse than no verdict.
      - name: Benchmark comparison contract (16 tests)
        run: python scripts/test_compare_benchmarks.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  gate:
    name: Evidence gate · 12 gates incl. SIGKILL, two-process, router failover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [guards]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install kernel-2027 and enforce adoption
        run: |
          # Install the shared kernel first: python-2027 now depends on it, and
          # the guard below fails the job if any engine re-implements a primitive.
          python3 -m pip install --disable-pip-version-check -e kernel-2027
          python3 -c "import kernel2027; print('kernel-2027 importable:', kernel2027.KERNEL_VERSION)"
          python3 scripts/kernel_guard.py
      - name: Install python-2027 (A2 needs the real FreeFirstRouter importable)
        run: |
          # The fleet package itself imports nothing external — `Guards` proves
          # that. This installs the *repo's* protocol package so the router gate
          # can exercise the real FreeFirstRouter instead of a stand-in.
          python3 -m pip install --disable-pip-version-check \
            "pydantic>=2.9,<3" "httpx>=0.27,<1" "structlog>=24.4,<27" \
            "opentelemetry-api>=1.27,<2" "opentelemetry-sdk>=1.27,<2" \
            "fastapi>=0.115,<1" "uvicorn>=0.30,<1"
          python3 -m pip install --disable-pip-version-check -e python-2027
          python3 -c "import ai2027_protocol; print('python-2027 importable:', ai2027_protocol.__file__)"
      - name: Run the gate (fails the job if any gate fails)
        run: python3 fleet-2027/gate.py --assert --out launch/evidence/fleet-2027-gate.json
      - name: Re-run the verifier against the artifact
        run: python3 fleet-2027/cli.py demo --db /tmp/ci-fleet.db --workspace /tmp/ci-ws --task ci-demo
      - name: The artifact must verify against its own digest
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "fleet-2027")
          from fleet2027 import canonical_json, sha256_text
          payload = json.loads(pathlib.Path("launch/evidence/fleet-2027-gate.json").read_text())
          claimed = payload.pop("artifact_sha256")
          actual = sha256_text(canonical_json(payload))
          print(f"claimed={claimed}\nactual ={actual}")
          raise SystemExit(0 if claimed == actual else 1)
          PY
      - name: LLM bridge · a real python-2027 provider must be refusable and injectable
        run: python3 scripts/fleet_llm_bridge_check.py --mode offline
      - name: Router bridge · A2 failover + exhaustion must be real
        run: |
          # simulated: provider A dies, provider B answers, file verified.
          python3 scripts/fleet_router_bridge_check.py --mode simulated
          # exhausted: every provider dies → dead letter with the full trail.
          python3 scripts/fleet_router_bridge_check.py --mode exhausted
          # live: must exit 3 (not attempted) when no real provider is configured,
          # and must never be counted as a pass. Both outcomes are acceptable here;
          # silently succeeding via the deterministic provider is not.
          set +e
          python3 scripts/fleet_router_bridge_check.py --mode live
          code=$?
          set -e
          echo "live exit=$code"
          test "$code" -eq 0 -o "$code" -eq 3
      - name: Publish evidence artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        if: always()
        with:
          name: fleet-2027-gate-${{ github.sha }}
          path: launch/evidence/fleet-2027-gate.json
          if-no-files-found: error
