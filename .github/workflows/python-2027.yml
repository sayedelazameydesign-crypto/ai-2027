# Automated CI for python-2027 — enforces Python 3.13 & 3.14, pinned uv==0.13.9
# with uv.lock, ruff, mypy --strict, pytest + hypothesis (>90% branch coverage),
# 48-project compliance registry, local Cloudflare Worker dry-run/dev checks,
# and gated main-branch Free-First routing through existing GitHub Actions secrets.
name: Python 2027 Protocol CI

on:
  push:
    branches: [main]
    paths:
      - "python-2027/**"
      - ".github/workflows/python-2027.yml"
  pull_request:
    branches: [main]
    paths:
      - "python-2027/**"
      - ".github/workflows/python-2027.yml"
  workflow_dispatch:
    inputs:
      run_live_providers:
        description: "Invoke Actions secrets (GEMINI / NVIDIA / GROQ / OPENROUTER free router) on main"
        required: false
        type: boolean
        default: true
      require_live_credential:
        description: "Fail if no configured live provider responds (false = skip cleanly when absent)"
        required: false
        type: boolean
        default: false
      provider:
        description: "Which provider(s) to invoke through Actions secrets"
        required: false
        type: choice
        default: "all"
        options: ["all", "auto", "gemini", "nvidia", "groq", "openrouter"]
      nvidia_model:
        description: "Optional non-secret NVIDIA model ID (defaults to NVIDIA_MODEL var or meta/llama-3.3-70b-instruct)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: python-2027-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-protocol:
    name: Python ${{ matrix.python-version }} · uv.lock · ruff · mypy · pytest >90%
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies strictly from uv.lock (pinned uv==0.13.9)
        working-directory: python-2027
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip "uv==0.13.9"
          .venv/bin/uv sync --locked --python .venv/bin/python --group dev

      - name: Lint and docstring enforcement (ruff)
        working-directory: python-2027
        run: |
          .venv/bin/ruff check --target-version py313 src tests workers/python-worker/src
          .venv/bin/ruff format --check src tests workers/python-worker/src

      - name: Strict static type checking (mypy + pydantic.mypy)
        working-directory: python-2027
        run: .venv/bin/mypy src tests

      - name: Tests + Hypothesis property suite (>90% branch coverage)
        working-directory: python-2027
        run: |
          .venv/bin/pytest --cov-fail-under=90 \
            --junitxml="$RUNNER_TEMP/junit-${{ matrix.python-version }}.xml"

      - name: Summarize test failures as annotations (readable without the log)
        if: failure()
        working-directory: python-2027
        env:
          JUNIT: ${{ runner.temp }}/junit-${{ matrix.python-version }}.xml
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def esc(text: str) -> str:
              return (
                  " ".join(text.split())
                  .replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )[:4000]

          path = Path(os.environ["JUNIT"])
          if not path.is_file():
              print("::error title=pytest::no junit report was written (the suite did not start)")
          else:
              tree = ET.parse(path)
              failures = []
              for case in tree.iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          message = (node.text or node.get("message") or "").strip()
                          failures.append(f"{case.get('classname')}::{case.get('name')} — {message}")
              if not failures:
                  print("::error title=pytest::junit shows no failing case (coverage or step-level failure)")
              for item in failures[:20]:
                  print(f"::error title=pytest::{esc(item)}")
              print(f"::notice title=pytest::{len(failures)} failing case(s)")
          PY

      - name: PAP persistent-task gate · real SIGKILL, resume from checkpoint (evidence artifact)
        working-directory: python-2027
        env:
          PAP_GATE_ANNOTATE: "1"
        run: |
          .venv/bin/python ../scripts/persistent_task_gate.py --assert \
            --report "$RUNNER_TEMP/persistent-task-gate-${{ matrix.python-version }}.json"

      - name: Upload the persistent-task gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pap-persistent-task-${{ matrix.python-version }}-${{ github.sha }}
          path: ${{ runner.temp }}/persistent-task-gate-${{ matrix.python-version }}.json
          if-no-files-found: warn

      - name: Demo, persistent traces, 48-project compliance registry & benchmarks
        working-directory: python-2027
        run: |
          .venv/bin/ai2027-py27 demo
          .venv/bin/ai2027-py27 providers
          .venv/bin/ai2027-py27 bench --iterations 15 --json > /tmp/bench-2027.json
          .venv/bin/ai2027-py27 audit python-2027 --json > /tmp/audit-2027.json
          .venv/bin/ai2027-py27 registry --json > /tmp/registry-2027.json

      - name: Upload benchmark, audit, and 48-project registry artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: python-2027-evidence-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            /tmp/bench-2027.json
            /tmp/audit-2027.json
            /tmp/registry-2027.json
          if-no-files-found: error

  edge-workers:
    name: Cloudflare Workers · Contract Tests + Wrangler Dry-Run ($0)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: Edge Gateway unit + fail-closed + budget + failover tests
        run: node --test python-2027/workers/edge-gateway/tests/gateway.test.mjs
      - name: Install Wrangler and verify dry-run bundles (NOT live Cloudflare deploy)
        run: |
          npm --prefix /tmp/wrangler-ci install --no-save wrangler@4.165.0
          /tmp/wrangler-ci/node_modules/.bin/wrangler deploy --dry-run --config python-2027/workers/edge-gateway/wrangler.jsonc
          /tmp/wrangler-ci/node_modules/.bin/wrangler deploy --dry-run --config python-2027/workers/python-worker/wrangler.toml
      - name: Edge Gateway local wrangler dev smoke (NOT live Cloudflare deploy)
        run: |
          /tmp/wrangler-ci/node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 8799 --config python-2027/workers/edge-gateway/wrangler.jsonc > /tmp/gw-dev.log 2>&1 &
          GW_PID=$!
          trap 'kill "$GW_PID" >/dev/null 2>&1 || true' EXIT
          node -e '
            const fs = require("node:fs");
            const deadline = Date.now() + 30000;
            async function poll() {
              while (Date.now() < deadline) {
                try {
                  const res = await fetch("http://127.0.0.1:8799/health");
                  if (res.status === 200) {
                    const data = await res.json();
                    console.log("edge-gateway local health:", data);
                    process.exit(0);
                  }
                } catch {}
                await new Promise((r) => setTimeout(r, 300));
              }
              if (fs.existsSync("/tmp/gw-dev.log")) {
                console.error(fs.readFileSync("/tmp/gw-dev.log", "utf8"));
              }
              console.error("edge-gateway wrangler dev did not respond");
              process.exit(1);
            }
            poll();
          '

  live-actions-keys:
    # Security gate matching docs/SECRETS.md: credentials never run on pull_request
    # or untrusted branches, are passed solely via step env:, and never printed.
    name: Free-First live routing · existing Actions secrets (main only)
    needs: [python-protocol]
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name != 'workflow_dispatch' || inputs.run_live_providers)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install python-2027 runtime strictly from uv.lock
        working-directory: python-2027
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip "uv==0.13.9"
          .venv/bin/uv sync --locked --python .venv/bin/python

      - name: Route through existing GitHub Actions secrets safely
        working-directory: python-2027
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          NVIDIA_MODEL: ${{ inputs.nvidia_model || vars.NVIDIA_MODEL || 'meta/llama-3.3-70b-instruct' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          AI2027_MAX_SPEND_USD: "0"
          AI2027_LIVE_PROVIDER: ${{ inputs.provider || 'all' }}
          AI2027_REQUIRE_LIVE: ${{ inputs.require_live_credential || false }}
        run: |
          set +x
          set -euo pipefail
          .venv/bin/ai2027-py27 providers
          args=(--provider "$AI2027_LIVE_PROVIDER" --json)
          if [ "$AI2027_REQUIRE_LIVE" = "true" ]; then
            args+=(--require-any)
          fi
          set +e
          .venv/bin/ai2027-py27 live "${args[@]}" > /tmp/live-2027.json
          rc=$?
          set -e
          python - <<'PY'
          import json, os, pathlib
          raw = pathlib.Path("/tmp/live-2027.json").read_text(encoding="utf-8").strip()
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if not raw:
              print("::error title=ai2027-py27 live::Live probe produced no JSON output")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as fh:
                      fh.write("### ⚡ Python 2027 Live Actions Secrets Verification\n\n- Live probe produced no JSON output (check step stderr).\n")
              raise SystemExit(0)
          data = json.loads(raw)
          routed = data["routed"]
          lines = [
              "### ⚡ Python 2027 Live Actions Secrets Verification",
              "",
              f"- target: `{data['target']}` · configured remote keys: **{data['configured_count']}** · live succeeded: **{data['live_succeeded']}** · trace: `{data['trace_id']}`",
              f"- Free-First route: `{routed['provider']}` (`{routed['model']}`) · tier=`{routed['billing_tier']}` · cost_known=`{routed['cost_known']}` · simulated=`{routed['simulated']}` · latency=`{routed['latency_ms']} ms`",
          ]
          if data["probes"]:
              lines += ["", "| Provider | Model | Credential | Status | Latency | Detail |", "|---|---|---|---|---:|---|"]
              for p in data["probes"]:
                  detail = str(p.get("error") or ("ok" if p.get("ok") else "")).replace("|", "/")[:120]
                  lines.append(f"| `{p['provider']}` | `{p['model']}` | `{p['credential_state']}` | `{p['status']}` | {p['latency_ms']} ms | {detail} |")
              compact = ", ".join(
                  f"{p['provider']}={p['status']} ({p['credential_state']})" for p in data["probes"]
              )
              level = "error" if (os.environ.get("AI2027_REQUIRE_LIVE") == "true" and not data["live_succeeded"]) else "notice"
              print(f"::{level} title=ai2027-py27 live::{compact} | routed={routed['provider']}")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          PY
          cat /tmp/live-2027.json
          exit "$rc"

      - name: Upload sanitized live verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: python-2027-live-keys-${{ github.sha }}
          path: /tmp/live-2027.json
          if-no-files-found: ignore

      - name: PAP-2027 live-connector gate · one real call, no key is a FAILURE
        id: live_connector
        working-directory: python-2027
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'meta/llama-3.3-70b-instruct' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          AI2027_MAX_SPEND_USD: "0"
          PAP_GATE_ANNOTATE: "1"
        run: |
          set +x
          set -euo pipefail
          .venv/bin/python ../scripts/live_connector_gate.py --assert \
            --python .venv/bin/python --timeout-s 60 \
            --report "$RUNNER_TEMP/live-connector-gate.json"

      - name: Upload the live-connector evidence (id, time, sanitized response)
        if: ${{ always() && steps.live_connector.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pap-live-connector-${{ github.sha }}
          path: ${{ runner.temp }}/live-connector-gate.json
          if-no-files-found: error
