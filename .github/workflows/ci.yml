# Evidence-First CI — Phase 2 / Week 1 of the 2027 roadmap.
# Gates: 86 kernel tests + 6 wrapper tests + CLI contract, AST zero-deps proof,
# reproducible benchmarks with a published jitter-aware regression ceiling,
# 12 demo contract tests, and an installable-wheel smoke test.
#
# Design rule: the kernel has ZERO third-party dependencies, so this workflow
# installs nothing into the code path it tests. Only the wheel job installs
# build tooling (setuptools/wheel), outside the kernel itself.
name: Evidence-First CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Kernel unit tests (86)
        run: python -m unittest discover -s projects/agi-system/tests -t projects/agi-system -v

      - name: Live Agent wrapper tests (6)
        run: python live-agent/test_server.py -v

      - name: CLI contract — VERIFIED / DENIED exit codes
        working-directory: projects/agi-system
        shell: bash
        run: |
          set -euo pipefail
          python -m core doctor
          python -m core run --goal-type create_file --param path=ci-smoke.txt --param content=hello > /tmp/verified.log 2>&1
          cat /tmp/verified.log
          grep -q "status : VERIFIED" /tmp/verified.log
          grep -q "hash_matches=true" /tmp/verified.log

          set +e
          python -m core run --goal-type create_file --param path=../../escape.txt --param content=x > /tmp/denied.log 2>&1
          rc=$?
          set -e
          cat /tmp/denied.log
          test "$rc" -eq 3
          grep -q "status : DENIED" /tmp/denied.log
          grep -q "escapes the sandbox" /tmp/denied.log

      - name: Zero third-party imports (AST gate)
        run: python scripts/ci_guard.py imports

      - name: CI guard self-tests (keeps the gates honest)
        run: python scripts/test_ci_guard.py -v

  demo-tests:
    name: Public demo contract (12 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Browser port must keep VERIFIED / DENIED / FAILED honest
        run: node website/kernel-demo.test.js
      - name: Static site files present
        run: |
          test -f website/index.html
          test -f website/demo.html
          test -f website/kernel-demo.js
          grep -q 'demo.html' website/index.html

  benchmark:
    name: Measured benchmarks + regression guard
    runs-on: ubuntu-latest
    needs: [tests, demo-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run bench.py (stdlib, reproducible)
        run: |
          cd live-agent
          python bench.py > bench.json   # also writes benchmarks/latest.json
      - name: Validate payload + publish numbers to job summary
        run: python scripts/ci_guard.py bench --input live-agent/bench.json
      - name: Upload raw measurements
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            live-agent/bench.json
            live-agent/benchmarks/latest.json
          if-no-files-found: error

  wheel:
    name: Build + smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling (outside the kernel)
        run: python -m pip install --upgrade "setuptools>=61" wheel
      - name: Sync upstream kernel + build wheel
        working-directory: packaging/agi-kernel
        run: ./build_wheel.sh
      - name: Install + CLI smoke test
        working-directory: packaging/agi-kernel
        run: |
          set -euo pipefail
          python -m pip install --no-deps --force-reinstall dist/*.whl
          agi-kernel --help
          agi-kernel doctor
          python -m pip show agi-kernel
      - name: Report exact wheel footprint
        working-directory: packaging/agi-kernel
        run: |
          ls -l dist/
          du -h dist/*.whl

  command-hud:
    name: Command HUD · real kernel + 100-attack gate + 48-project audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: HUD is stdlib-only too (AST gate on the new code path)
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path
          stdlib = set(sys.stdlib_module_names) | {"tomllib"}
          bad = {}
          for p in sorted(Path("command-hud").glob("*.py")):
              for n in ast.walk(ast.parse(p.read_text(encoding="utf-8"))):
                  names = []
                  if isinstance(n, ast.Import):
                      names = [a.name.split(".")[0] for a in n.names]
                  elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                      names = [n.module.split(".")[0]]
                  for name in names:
                      if name not in stdlib and name not in {"audit", "redteam", "kernel_bridge", "server", "store", "evaluate"}:
                          bad.setdefault(str(p), set()).add(name)
          print("scanned", len(list(Path("command-hud").glob("*.py"))), "HUD files",
                "(local siblings: audit, redteam, kernel_bridge, server, store, evaluate)")
          if bad:
              print("THIRD-PARTY:", bad, file=sys.stderr); sys.exit(1)
          print("PASS: stdlib only")
          PY
      - name: End-to-end HUD tests (13, real HTTP + real kernel)
        run: python command-hud/test_hud.py -v
      - name: Red-team gate — 100 attacks, 0 breaches, 10/10 controls
        run: python command-hud/redteam.py --markdown --assert
      - name: Repository audit — 48 projects, 5 probes must pass
        run: |
          python command-hud/audit.py --assert-probes > command-hud/audit-latest.json
          python command-hud/audit.py --fast --report command-hud/audit-report.md
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: repository-audit-${{ github.sha }}
          path: |
            command-hud/audit-latest.json
            command-hud/audit-report.md
          if-no-files-found: error

  memory:
    name: L1 memory · admission gate + measured retrieval honesty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Memory is stdlib-only (no sqlite-vec, no model client)
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path
          stdlib = set(sys.stdlib_module_names) | {"tomllib"}
          allowed_local = {"store", "evaluate", "kernel_bridge"}
          bad = {}
          for p in sorted(Path("memory").glob("*.py")):
              for n in ast.walk(ast.parse(p.read_text(encoding="utf-8"))):
                  names = []
                  if isinstance(n, ast.Import):
                      names = [a.name.split(".")[0] for a in n.names]
                  elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                      names = [n.module.split(".")[0]]
                  for name in names:
                      if name not in stdlib and name not in allowed_local:
                          bad.setdefault(str(p), set()).add(name)
          print("scanned", len(list(Path("memory").glob("*.py"))), "memory files")
          if bad:
              print("THIRD-PARTY:", bad, file=sys.stderr); sys.exit(1)
          print("PASS: stdlib only")
          PY
      - name: sqlite-vec must NOT be required (assert the honest backend)
        run: |
          python - <<'PY'
          import sqlite3, sys
          try:
              sqlite3.connect(":memory:").execute("select vec_version()")
              print("NOTE: sqlite-vec IS present; the store still does not require it.")
          except sqlite3.OperationalError:
              print("CONFIRMED: sqlite-vec absent — store uses stdlib sqlite3 as documented.")
          sys.exit(0)
          PY
      - name: Admission gate + tamper detection (16 tests, real kernel)
        run: python memory/test_memory.py -v
      - name: Retrieval honesty report (recall + false positives, misses included)
        run: |
          python memory/evaluate.py > memory-eval.json
          python - <<'PY'
          import json, sys
          d = json.load(open("memory-eval.json"))
          print(f"recall@3 easy {d['positive_hits_at_3']}/{d['positive_queries']}"
                f" | hard {d['hard_hits_at_3']}/{d['hard_queries']}"
                f" | FP unrelated {d['negative_with_confident_hit']}/{d['negative_queries']}"
                f" | FP near-miss {d['near_miss_confident_hits']}/{d['near_miss_queries']}")
          # The published claim is the HARD number. Fail if the docs stop matching it.
          claimed = 2
          if d["hard_hits_at_3"] != claimed:
              print(f"FAIL: docs claim {claimed}/16 on the paraphrase set, measured "
                    f"{d['hard_hits_at_3']}/16 — update memory/README.md", file=sys.stderr)
              sys.exit(1)
          if d["negative_with_confident_hit"] != 0:
              print("FAIL: unrelated query produced a confident hit", file=sys.stderr)
              sys.exit(1)
          print("PASS: published numbers match the measurement")
          PY
      - name: End-to-end demo (admit / refuse / tamper / noise floor)
        run: python memory/store.py demo
      - name: Upload retrieval evidence
        uses: actions/upload-artifact@v4
        with:
          name: memory-eval-${{ github.sha }}
          path: memory-eval.json
          if-no-files-found: error

  launch-evidence:
    name: Publish kit · regenerate every claim + verify evidence links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Every public claim must still have evidence (10 tests)
        run: python launch/test_launch_claims.py -v
      - name: Regenerate ALL measured numbers from executed commands
        run: python scripts/generate_launch_evidence.py --assert
      - name: Production case-study harness must refuse fabricated data
        run: |
          python launch/production_evidence.py --template > /tmp/empty-jobs.json
          if python launch/production_evidence.py --input /tmp/empty-jobs.json; then
            echo "FAIL: empty template was accepted — invented data could be published" >&2
            exit 1
          fi
          echo "PASS: NO EVIDENCE = NO VERIFIED SUCCESS"
      - name: Upload freshly measured launch evidence
        uses: actions/upload-artifact@v4
        with:
          name: launch-evidence-${{ github.sha }}
          path: |
            launch/evidence/latest.json
            launch/evidence/REPORT.md
          if-no-files-found: error
