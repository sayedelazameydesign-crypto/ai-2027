# Evidence-First CI — Phase 2 / Week 1 of the 2027 roadmap.
# Gates: 104 kernel tests + 20 Live Agent wrapper tests + Agent Substrate MVP tests,
# authenticated client and snapshot regressions + CLI contract, AST zero-deps proof, reproducible benchmarks,
# 12 demo contract tests, 44 watchdog tests + 9 Phase 2B alerting tests, and
# an installable-wheel smoke test.
#
# Design rule: the kernel has ZERO third-party dependencies, so its test job
# installs nothing into the code path it tests. The separate Connectors Hub job
# installs only that package's declared dependencies and uses mocked providers;
# it receives no provider credentials. The wheel job installs build tooling.
name: Evidence-First CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_gemini:
        description: "Opt in to the tiny live Gemini check"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_live_gemini:
        description: "Opt in to the tiny live Gemini check when this workflow is reused"
        required: false
        type: boolean
        default: false
    secrets:
      GEMINI_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps-script-watcher:
    name: Apps Script watcher · offline privacy and pagination
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22"
      - name: Run hermetic watcher tests (no credentials)
        run: node --test integrations/apps-script/proactive-watcher/test_watcher.cjs

  free-first-tools:
    name: Free-first tools · offline safety and task previews
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Test offline tools (model responses mocked)
        run: python -m unittest discover -s tools -p 'test_*.py' -v

  tests:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Kernel unit tests (104)
        run: python -m unittest discover -s projects/agi-system/tests -t projects/agi-system -v

      - name: Live Agent wrapper tests (20)
        run: python live-agent/test_server.py -v

      - name: Agent Substrate lifecycle, isolation and gateway tests
        run: python -m unittest discover -s agent-substrate/tests -v

      - name: CeliaOS verified file bridge and approval tests
        run: |
          python projects/celiaos-agent-framework/test_verified_executor.py -v
          python projects/celiaos-agent-framework/test_approval_gate.py -v

      - name: Cross-platform containment regression (6)
        run: python scripts/test_policy_hardening.py -v

      - name: Kernel verification regression (11) — verify=False can never be VERIFIED
        run: python scripts/test_kernel_verification.py -v

      - name: CLI contract — VERIFIED / DENIED exit codes
        working-directory: projects/agi-system
        shell: bash
        run: |
          set -euo pipefail
          python -m core doctor
          python -m core run --goal-type create_file --param path=ci-smoke.txt --param content=hello > /tmp/verified.log 2>&1
          cat /tmp/verified.log
          grep -q "status : VERIFIED" /tmp/verified.log
          grep -q "hash_matches=true" /tmp/verified.log

          set +e
          python -m core run --goal-type create_file --param path=../../escape.txt --param content=x > /tmp/denied.log 2>&1
          rc=$?
          set -e
          cat /tmp/denied.log
          test "$rc" -eq 3
          grep -q "status : DENIED" /tmp/denied.log
          grep -q "escapes the sandbox" /tmp/denied.log

      - name: Zero third-party imports (AST gate)
        run: python scripts/ci_guard.py imports

      # P1 cognitive-intelligence foundation: the operating-mind prompt loader
      # and the capability routing profiles. These are stdlib-only, so they run
      # here with no third-party packages installed — the same guarantee the
      # AST gate above enforces on the source. Named explicitly so the
      # baseline-sensitive operational-evidence suite is not pulled in.
      - name: P1 foundation — prompt loader and routing profile tests (stdlib only)
        run: python -m unittest tests.test_prompt_loader tests.test_routing_profiles -v

      - name: CI guard self-tests (keeps the gates honest)
        run: python scripts/test_ci_guard.py -v

      # `cmd | tee log` reports tee's status, so a failed step can read as a
      # pass. This gate was written after finding one in ci.yml itself and two
      # in real-model.yml's diagnostics. Its own tests are run first: a gate
      # that has never been shown to fail is decoration.
      - name: Workflow pipe guard self-tests — must catch a real case (5)
        run: python scripts/test_workflow_pipe_guard.py -v

      - name: Workflow pipe guard — no tee pipeline can hide a failure
        run: python scripts/workflow_pipe_guard.py --assert

      # scripts/ holds gates whose tests were not all wired into CI. One
      # (test_nvidia_live_check) could not even be imported. This step runs
      # every scripts/test_*.py from the repo root, so a test that only worked
      # from its own directory fails here instead of never running.
      - name: Every scripts/ test suite runs from the repository root
        run: |
          set -euo pipefail
          failed=""
          for f in scripts/test_*.py; do
            module="scripts.$(basename "${f%.py}")"
            if ! python -m unittest "${module}" > "/tmp/${module}.log" 2>&1; then
              echo "::error::${module} failed; log follows"
              tail -25 "/tmp/${module}.log"
              failed="${failed} ${module}"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "::error::failed suites:${failed}"
            exit 1
          fi
          echo "every scripts/ suite passed from the repository root"

      # The doctor is the one command that answers "is this checkout ready?".
      # Running it in CI keeps it honest: a check that nobody ever executes
      # is a check that silently rots.
      #
      # Exit code 3 means "skips only, no failures" and is acceptable here:
      # on a CI runner the protocol package is not installed at this point,
      # so the import check legitimately reports a skip.
      #
      # The exit code is captured through `||` rather than through `$?`,
      # because GitHub Actions runs this block with `bash -eo pipefail`, and
      # `-e` would abort the step on ANY non-zero exit before the status
      # could be inspected. `--lenient` additionally downgrades the
      # environment-dependent checks (interpreter version, package install
      # state) to warnings, because this matrix deliberately runs an
      # interpreter older than the package's own floor.
      - name: Doctor — is this checkout ready to run?
        run: |
          code=0
          python scripts/doctor.py --json --lenient > /tmp/doctor.json || code=$?
          if [ ! -s /tmp/doctor.json ]; then
            echo "::error::the doctor produced no report"
            exit 1
          fi
          cat /tmp/doctor.json
          if [ "$code" -eq 1 ]; then
            echo "::error::the doctor reported a failed check"
            exit 1
          fi
          if [ "$code" -gt 3 ]; then
            echo "::error::the doctor could not run (exit $code)"
            exit 1
          fi
          echo "doctor exit $code (0 = all passed, 3 = skips only)"

      - name: Secret gate tests — catch keys, spare fixtures (17)
        run: python scripts/test_secret_scan.py -v

      - name: Secret gate on every tracked file (no credentials in code paths)
        run: python scripts/secret_scan.py --all --scope code

      - name: PAP-2027 gap audit — a claimed engine must keep its code and tests
        run: |
          python scripts/test_pap_gap_audit.py -v
          python scripts/pap_gap_audit.py --assert

      - name: Network preflight tests — blindness is not death (10)
        run: python scripts/test_network_preflight.py -v

      - name: Live egress audit tests — claims may fail, never be guessed (18)
        run: python scripts/test_live_egress.py -v

      - name: Archive identity tests — drift vs deviation vs generated (17)
        run: python scripts/test_verify_identity.py -v

      - name: Ember beat tests — heat index + honest publishing (13)
        run: python scripts/test_ember_beat.py -v

      - name: Health gate tests — the gate must be able to refuse (24)
        run: python scripts/test_health_gate.py -v

      - name: Task runner tests — the 60 s budget must be falsifiable (10)
        run: python scripts/test_run_task.py -v

      - name: Secret-handling tests — the key must never reach the output (15)
        run: python scripts/test_gemini_live_check.py -v

      - name: Gated deploy tests — accepted is not verified (14)
        run: python scripts/test_render_deploy.py -v

      - name: BrowserSkill installer tests — fail-closed SHA-256 + no sudo (10)
        run: python scripts/test_install_browserskill.py -v

      - name: BrowserSkill Stage 1 adapter tests — policy, no-replay, redaction, L1 memory (34)
        run: python browser_skill_adapter/test_adapter.py -v

      - name: BrowserSkill local handoff — consent, cross-process lock/replay and cleanup (simulated browser)
        run: python browser_skill_adapter/test_verified_handoff.py -v

      - name: Secret-handling audit — safe-mapped and documented (30)
        run: |
          python scripts/test_workflow_secret_audit.py -v
          python scripts/workflow_secret_audit.py --assert

      - name: Every GitHub Action must be pinned to a full SHA (SBOM verifier)
        run: python scripts/sbom.py --assert-pinned --out /tmp/sbom.json

  connectors-hub:
    name: Connectors Hub tests · Python ${{ matrix.python-version }} (mock providers only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared package dependencies (no provider secrets)
        working-directory: connectors-hub
        run: python -m pip install --editable .
      - name: Mock-only unit suite
        working-directory: connectors-hub
        run: python -m unittest discover -s tests -v
      - name: Package and dependency sanity
        working-directory: connectors-hub
        run: |
          python -m compileall -q src tests
          python -m pip check

  open-source-code-exec:
    name: Open Source code execution · offline E2B policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Install test dependencies (no live sandbox credentials)
        working-directory: projects/open_source-
        run: python -m pip install --editable ".[dev]"
      - name: Fail-closed E2B and Firecracker backend tests (mocked)
        working-directory: projects/open_source-
        run: python -m pytest -q tests/test_code_exec_production.py
      - name: E2B smoke wrapper tests (in-memory sandbox only)
        working-directory: projects/open_source-
        run: python -m unittest discover -s tests -p test_e2b_live_check.py -v

  open-source-mcp:
    name: Open Source MCP transport · ADR-0017 contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Install test dependencies (no MCP credentials, no network)
        working-directory: projects/open_source-
        # The `server` extra is required: the MCP tests drive our own MCP
        # server as a subprocess and exercise the CLI, and os_server imports
        # fastapi. Without it five of them fail on a missing module.
        run: python -m pip install --editable ".[dev,server]"
      # The MCP transport contract (JSON-RPC framing, stdio + Streamable HTTP,
      # config parsing, env expansion, guardrails bridge) was implemented under
      # ADR-0017 but never executed by CI, so a regression there would have
      # reached every deployment unnoticed. These tests are hermetic: no
      # network, no MCP server, no credential — the stdio and HTTP clients are
      # driven against an in-process fake server.
      - name: MCP transport contract tests (hermetic, no network)
        working-directory: projects/open_source-
        run: python -m pytest -q tests/test_mcp.py tests/test_tools_mcp_seam.py
      # The documentation claims are executable contracts: the scripts index
      # must describe every script, and the README must describe what the
      # repository actually contains.
      - name: Documentation claims tests
        working-directory: projects/open_source-
        run: python -m pytest -q tests/test_docs_claims.py

  open-source-full-suite:
    name: Open Source full suite · NON-BLOCKING baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deliberately NOT required, and deliberately not allowed to fail the
    # build. The whole projects/open_source- suite (1587 tests) has never
    # run in CI, so this job exists to establish a baseline and to surface
    # any latent failure BEFORE the suite is made required.
    #
    # continue-on-error means the job reports its real conclusion (so the
    # history is honest) while the overall workflow stays green. Once the
    # baseline is known to be clean, a separate change can drop
    # continue-on-error and add this job to the required checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Install test dependencies (no live credentials, no network)
        working-directory: projects/open_source-
        run: python -m pip install --editable ".[dev,server]"
      # The default marker expression excludes live-channel tests, and the
      # suite is hermetic: no network, no credential, no external service.
      # It took ~57s locally on the same Python version.
      - name: Full projects/open_source- suite (baseline)
        working-directory: projects/open_source-
        run: python -m pytest -q -p no:cacheprovider

  browser-handoff-windows:
    name: BrowserSkill local handoff · Windows ACL and process lock (simulated browser)
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      # A full Windows checkout fails on an unrelated archived path ending in a
      # dot. Fetch the exact workflow ref into a bare object store, then materialize
      # and hash-verify only this ASCII-safe subtree; never skip the Windows tests.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      # The hosted Windows profile has an explicit AppContainer execute ACE,
      # which is correctly rejected by the production ACL checker. Use a
      # disposable owner-only profile so these tests measure our policy, not the
      # runner's unrelated profile configuration.
      - name: Provision isolated owner-only test profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testHome = Join-Path $env:RUNNER_TEMP 'browser-handoff-private-profile'
          $testTemp = Join-Path $testHome 'Temp'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          $owner = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $inheritance = [Security.AccessControl.InheritanceFlags]::ContainerInherit -bor [Security.AccessControl.InheritanceFlags]::ObjectInherit
          foreach ($directory in @($testHome, $testTemp)) {
            $acl = [Security.AccessControl.DirectorySecurity]::new()
            $acl.SetOwner($owner)
            $acl.SetAccessRuleProtection($true, $false)
            $rule = [Security.AccessControl.FileSystemAccessRule]::new(
              $owner,
              [Security.AccessControl.FileSystemRights]::FullControl,
              $inheritance,
              [Security.AccessControl.PropagationFlags]::None,
              [Security.AccessControl.AccessControlType]::Allow)
            $acl.AddAccessRule($rule)
            Set-Acl -LiteralPath $directory -AclObject $acl
          }
          $drive = [System.IO.Path]::GetPathRoot($testHome).TrimEnd([char]92)
          $homePath = $testHome.Substring($drive.Length)
          $environment = @(
            "USERPROFILE=$testHome",
            "HOME=$testHome",
            "HOMEDRIVE=$drive",
            "HOMEPATH=$homePath",
            "TEMP=$testTemp",
            "TMP=$testTemp",
            "TMPDIR=$testTemp"
          ) -join "`n"
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            $environment + "`n",
            [System.Text.UTF8Encoding]::new($false))
          Write-Host 'Prepared an isolated owner-only profile for the ACL tests.'
      - name: Materialize verified BrowserSkill files without full checkout
        shell: python
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess
          from tempfile import TemporaryDirectory

          revision = os.environ["GITHUB_SHA"]
          url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}.git"
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          entry_pattern = re.compile(
              rb"100(?:644|755) blob ([0-9a-f]{40})\t"
              rb"(browser_skill_adapter/[A-Za-z0-9_-]+(?:[./][A-Za-z0-9_-]+)*)"
          )

          with TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as store:
              def git(*args):
                  return subprocess.check_output(
                      ["git", "-C", store, *args], stdin=subprocess.DEVNULL
                  )

              stage = "Initialize bare object store"
              try:
                  git("init", "--bare", "--quiet")
                  stage = "Fetch the exact workflow commit"
                  git("-c", "credential.helper=", "fetch", "--quiet", "--no-tags",
                      "--depth=1", url, revision)
                  stage = "Match fetched commit to the run commit"
                  fetched = git("rev-parse", "--verify", "FETCH_HEAD^{commit}").strip().decode("ascii")
                  if fetched != revision:
                      raise ValueError("Fetched commit differs from the workflow run commit")

                  stage = "Materialize and verify BrowserSkill blobs"
                  entries = git("ls-tree", "-r", revision, "--", "browser_skill_adapter").splitlines()
                  if not entries:
                      raise ValueError("BrowserSkill tree is empty")
                  for entry in entries:
                      match = entry_pattern.fullmatch(entry)
                      if match is None:
                          raise ValueError("Unexpected mode or path in BrowserSkill tree")
                      blob_id, relative_path = (part.decode("ascii") for part in match.groups())
                      data = git("cat-file", "blob", blob_id)
                      output = workspace / relative_path
                      output.parent.mkdir(parents=True, exist_ok=True)
                      with output.open("xb") as handle:
                          handle.write(data)
                      written = output.read_bytes()
                      digest = hashlib.sha1(
                          f"blob {len(written)}\0".encode("ascii") + written
                      ).hexdigest()
                      if digest != blob_id:
                          raise ValueError("Materialized bytes differ from the Git blob")
              except (OSError, subprocess.CalledProcessError, ValueError) as exc:
                  print(f"::error title=Windows source::{stage} failed ({type(exc).__name__})", flush=True)
                  raise
          print(f"::notice title=Windows source::Verified {len(entries)} files from {revision}")
      - name: Native NTFS ACLs, exclusive creation and process restart
        shell: python
        run: |
          import re
          import subprocess
          import sys

          expected = {
              "WindowsAclTest.test_private_directory_passes_and_world_grant_blocks_browser",
              "WindowsAclTest.test_private_parent_does_not_hide_an_exposed_replay_file",
              "WindowsAclTest.test_unreadable_acl_cannot_be_accepted",
              "HandoffTest.test_exclusive_create_race_has_one_winner_across_processes",
              "HandoffTest.test_spawned_attempts_and_fresh_process_replay",
              "HandoffTest.test_abrupt_exit_retains_reservation_and_replay_is_still_blocked",
          }
          command = [
              sys.executable,
              "browser_skill_adapter/test_verified_handoff.py",
              "WindowsAclTest",
              "HandoffTest.test_exclusive_create_race_has_one_winner_across_processes",
              "HandoffTest.test_spawned_attempts_and_fresh_process_replay",
              "HandoffTest.test_abrupt_exit_retains_reservation_and_replay_is_still_blocked",
          ]
          result = subprocess.run(
              command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              text=True, errors="replace",
          )
          print(result.stdout, end="", flush=True)
          lines = result.stdout.splitlines()
          pattern = re.compile(
              r"test_\w+ \(__main__\.((?:WindowsAclTest|HandoffTest)\.test_\w+)\) \.\.\. (ok|FAIL|ERROR|skipped)\b"
          )
          cases = [match.groups() for line in lines if (match := pattern.match(line))]
          for name, status in cases:
              level = "notice" if status == "ok" else "error"
              print(f"::{level} title=Windows test::{name} ... {status}", flush=True)

          names = {name for name, _ in cases}
          all_ok = (
              result.returncode == 0
              and len(cases) == len(expected)
              and names == expected
              and all(status == "ok" for _, status in cases)
              and any(line == "OK" for line in lines)
          )
          if not all_ok:
              for index, line in enumerate(lines):
                  if line.startswith(("FAIL: ", "ERROR: ")):
                      detail = " | ".join(lines[index:index + 8])
                      detail = detail.replace("%", "%25")
                      print(f"::error title=Windows test traceback::{detail}", flush=True)
              print("::error title=Windows test::Expected six distinct passing tests with no skips.", flush=True)
              raise SystemExit(result.returncode or 1)

  recovery:
    name: One-command recovery + real task under 60 s (T4 + T6)
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Boot the whole ember with one command (boot + real smoke + shutdown)
        run: |
          # Without pipefail this step reports 0 whenever `tee` succeeds, even if
          # the boot failed. Proven: `false | tee f; echo $?` prints 0 in bash.
          set -euo pipefail
          ./scripts/ember_up.sh --check --no-browser --json | tee /tmp/up.json

      - name: Run one real task and measure it end-to-end
        run: |
          set -euo pipefail
          ./scripts/ember_up.sh --no-browser --no-smoke --json > /tmp/up2.json
          trap './scripts/ember_up.sh --stop' EXIT
          python scripts/run_task.py --json --budget 60 > /tmp/task.json
          python - <<'PY'
          import json, pathlib

          def load(path):
              raw = pathlib.Path(path).read_text().strip()
              try:
                  return json.loads(raw)
              except ValueError:                      # last JSON-looking line
                  for line in reversed(raw.splitlines()):
                      line = line.strip()
                      if line.startswith("{"):
                          return json.loads(line)
              raise SystemExit(f"no JSON in {path}: {raw[:200]!r}")

          task = load("/tmp/task.json")
          up = load("/tmp/up.json")
          assert task["status"] == "VERIFIED", task
          assert task["claims"]["within_budget"] is True, task["claims"]
          assert task["artifact"]["hash_verified"] is True, task["artifact"]
          lines = [
              "### T4 — one-command recovery",
              f"- boot + 17-check smoke + shutdown: {up['elapsed_ms']} ms · {up['smoke']}",
              "",
              "### T6 — one real task, measured",
              f"- run_id `{task['run_id']}` · status **{task['status']}** · "
              f"{task['claims']['elapsed_ms']} ms (budget {task['claims']['budget_ms']} ms)",
              f"- artifact `{task['artifact']['path']}` · sha256 recomputed and matched · "
              f"{task['artifact']['bytes']} bytes",
              f"- evidence: {task['evidence_link']}",
          ]
          print("\n".join(lines))
          pathlib.Path("/tmp/t46.md").write_text("\n".join(lines) + "\n")
          PY
          cat /tmp/t46.md >> "$GITHUB_STEP_SUMMARY"

  demo-tests:
    name: Public demo contract (12 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "20"
      - name: Browser port must keep VERIFIED / DENIED / FAILED honest
        run: node website/kernel-demo.test.js
      - name: Productivity Kit — manual reports and isolated fixtures
        run: node --test scripts/test_productivity_kit.mjs
      - name: Static site files present
        run: |
          test -f website/index.html
          test -f website/demo.html
          test -f website/kernel-demo.js
          grep -q 'demo.html' website/index.html

  local-workspace-gateway:
    name: Workspace UI local gateway + cleanup contract (real loopback HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "20"
      - name: Install the locked Workspace UI dependencies
        working-directory: workspace-ui
        run: npm ci
      - name: Cleanup status contract — direct, wrapped, failure, unknown
        run: node live-agent/static/cleanup-status.test.cjs
      - name: Workspace UI TypeScript check and production build
        working-directory: workspace-ui
        run: |
          npm run typecheck
          npm run build
      - name: Live Agent credential-compatible reuse (no smoke and no test writes)
        run: python scripts/test_ember_reuse_auth.py -v
      - name: Real ember_up.sh → Vite → Live Agent/HUD regression
        run: python scripts/test_workspace_local_gateway.py -v

  benchmark:
    name: Measured benchmarks + regression guard
    runs-on: ubuntu-latest
    needs: [tests, demo-tests]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Run bench.py (stdlib, reproducible)
        run: |
          cd live-agent
          python bench.py > bench.json   # also writes benchmarks/latest.json
      - name: Validate payload + publish numbers to job summary
        run: python scripts/ci_guard.py bench --input live-agent/bench.json
      - name: Upload raw measurements
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            live-agent/bench.json
            live-agent/benchmarks/latest.json
          if-no-files-found: error

  wheel:
    name: Build + smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Install build tooling (outside the kernel)
        run: python -m pip install --upgrade "setuptools>=61" wheel
      - name: Sync upstream kernel + build wheel
        working-directory: packaging/agi-kernel
        run: ./build_wheel.sh
      - name: Install + CLI smoke test
        working-directory: packaging/agi-kernel
        run: |
          set -euo pipefail
          python -m pip install --no-deps --force-reinstall dist/*.whl
          agi-kernel --help
          agi-kernel doctor
          python -m pip show agi-kernel
      - name: Report exact wheel footprint
        working-directory: packaging/agi-kernel
        run: |
          ls -l dist/
          du -h dist/*.whl

  command-hud:
    name: Command HUD · real kernel + 100-attack gate + 48-project audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "20"
      - name: HUD is stdlib-only too (AST gate on the new code path)
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path
          stdlib = set(sys.stdlib_module_names) | {"tomllib"}
          bad = {}
          for p in sorted(Path("command-hud").glob("*.py")):
              for n in ast.walk(ast.parse(p.read_text(encoding="utf-8"))):
                  names = []
                  if isinstance(n, ast.Import):
                      names = [a.name.split(".")[0] for a in n.names]
                  elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                      names = [n.module.split(".")[0]]
                  for name in names:
                      if name not in stdlib and name not in {"audit", "redteam", "kernel_bridge", "server", "store", "evaluate", "network_preflight"}:
                          bad.setdefault(str(p), set()).add(name)
          print("scanned", len(list(Path("command-hud").glob("*.py"))), "HUD files",
                "(local siblings: audit, redteam, kernel_bridge, server, store, evaluate, "
                "network_preflight from scripts/)")
          if bad:
              print("THIRD-PARTY:", bad, file=sys.stderr); sys.exit(1)
          print("PASS: stdlib only")
          PY
      - name: End-to-end HUD tests (19, real HTTP + real kernel)
        run: python command-hud/test_hud.py -v
      - name: Red-team gate — 100 attacks, 0 breaches, 10/10 controls
        run: python command-hud/redteam.py --markdown --assert
      - name: Repository audit — 48 projects, 5 probes must pass
        run: |
          python command-hud/audit.py --assert-probes > command-hud/audit-latest.json
          python command-hud/audit.py --fast --report command-hud/audit-report.md
      - name: Upload audit evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: repository-audit-${{ github.sha }}
          path: |
            command-hud/audit-latest.json
            command-hud/audit-report.md
          if-no-files-found: error

  memory:
    name: L1 memory · admission gate + measured retrieval honesty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Memory is stdlib-only (no sqlite-vec, no model client)
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path
          stdlib = set(sys.stdlib_module_names) | {"tomllib"}
          # repo-local modules inside memory/ (stdlib-only themselves, scanned
          # by this same loop): "retrieval" is the v2 scoring layer.
          allowed_local = {"store", "evaluate", "kernel_bridge", "retrieval"}
          bad = {}
          for p in sorted(Path("memory").glob("*.py")):
              for n in ast.walk(ast.parse(p.read_text(encoding="utf-8"))):
                  names = []
                  if isinstance(n, ast.Import):
                      names = [a.name.split(".")[0] for a in n.names]
                  elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                      names = [n.module.split(".")[0]]
                  for name in names:
                      if name not in stdlib and name not in allowed_local:
                          bad.setdefault(str(p), set()).add(name)
          print("scanned", len(list(Path("memory").glob("*.py"))), "memory files")
          if bad:
              print("THIRD-PARTY:", bad, file=sys.stderr); sys.exit(1)
          print("PASS: stdlib only")
          PY
      - name: sqlite-vec must NOT be required (assert the honest backend)
        run: |
          python - <<'PY'
          import sqlite3, sys
          try:
              sqlite3.connect(":memory:").execute("select vec_version()")
              print("NOTE: sqlite-vec IS present; the store still does not require it.")
          except sqlite3.OperationalError:
              print("CONFIRMED: sqlite-vec absent — store uses stdlib sqlite3 as documented.")
          sys.exit(0)
          PY
      - name: Admission gate + tamper detection (19 tests, real kernel)
        run: python memory/test_memory.py -v
      - name: Retrieval honesty report (recall + false positives, misses included)
        run: |
          python memory/evaluate.py > memory-eval.json
          python - <<'PY'
          import json, sys
          d = json.load(open("memory-eval.json"))
          print(f"recall@3 easy {d['positive_hits_at_3']}/{d['positive_queries']}"
                f" | hard {d['hard_hits_at_3']}/{d['hard_queries']}"
                f" | FP unrelated {d['negative_with_confident_hit']}/{d['negative_queries']}"
                f" | FP near-miss {d['near_miss_confident_hits']}/{d['near_miss_queries']}")
          # The published claim is the HARD number, read from the docs themselves so
          # code and docs can never drift apart.
          import re, pathlib
          doc = pathlib.Path("memory/README.md").read_text(encoding="utf-8")
          m = re.search(r"paraphrase set \| \*\*(\d+)/16", doc)
          claimed = int(m.group(1)) if m else -1
          if claimed < 0:
              print("FAIL: memory/README.md no longer publishes the hard-set claim", file=sys.stderr)
              sys.exit(1)
          if d["hard_hits_at_3"] != claimed:
              print(f"FAIL: docs claim {claimed}/16 on the paraphrase set, measured "
                    f"{d['hard_hits_at_3']}/16 — update memory/README.md", file=sys.stderr)
              sys.exit(1)
          if d["negative_with_confident_hit"] != 0:
              print("FAIL: unrelated query produced a confident hit", file=sys.stderr)
              sys.exit(1)
          if d["near_miss_confident_hits"] != 0:
              print("FAIL: a near-miss negative became a confident hit — raising "
                    "recall must never cost false positives", file=sys.stderr)
              sys.exit(1)
          print("PASS: published numbers match the measurement")
          PY
      - name: End-to-end demo (admit / refuse / tamper / noise floor)
        run: python memory/store.py demo
      - name: Upload retrieval evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: memory-eval-${{ github.sha }}
          path: memory-eval.json
          if-no-files-found: error

  deployment:
    name: Deployment configs · must parse, must start, must cap the disk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Deployment layer is stdlib-only too (AST gate)
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path
          stdlib = set(sys.stdlib_module_names) | {"tomllib"}
          # `yaml` is allowed in TEST code only, and only behind an ImportError
          # guard (it is an optional convenience for parsing render.yaml; CI
          # installs it in a later step, and the test skips cleanly without it).
          # The launcher itself must stay pure stdlib and is checked strictly.
          optional_in_tests = {"yaml"}
          bad = {}
          for p in sorted(Path("deployment").glob("*.py")):
              tree = ast.parse(p.read_text(encoding="utf-8"))
              guarded = set()
              for n in ast.walk(tree):
                  if isinstance(n, ast.Try):
                      for h in n.handlers:
                          if h.type is not None and "ImportError" in ast.unparse(h.type):
                              for sub in ast.walk(n):
                                  if isinstance(sub, ast.Import):
                                      guarded.update(a.name.split(".")[0] for a in sub.names)
                                  elif isinstance(sub, ast.ImportFrom) and sub.module:
                                      guarded.add(sub.module.split(".")[0])
              is_test = p.name.startswith("test_")
              for n in ast.walk(tree):
                  names = []
                  if isinstance(n, ast.Import):
                      names = [a.name.split(".")[0] for a in n.names]
                  elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                      names = [n.module.split(".")[0]]
                  for name in names:
                      if name in stdlib:
                          continue
                      if is_test and name in guarded and name in optional_in_tests:
                          continue
                      bad.setdefault(str(p), set()).add(name)
          print("scanned", len(list(Path("deployment").glob("*.py"))), "deployment files")
          if bad:
              print("THIRD-PARTY:", bad, file=sys.stderr); sys.exit(1)
          print("PASS: stdlib only (optional guarded test-only imports allowed:")
          print("      yaml, only if wrapped in try/except ImportError)")
          PY
      - name: Requirements must declare ZERO packages
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          lines = [l.strip() for l in Path("requirements.txt").read_text().splitlines()]
          reqs = [l for l in lines if l and not l.startswith("#")]
          if reqs:
              print(f"FAIL: requirements.txt declares {reqs}", file=sys.stderr)
              sys.exit(1)
          print("PASS: zero declared dependencies")
          PY
      - name: Deployment configs + live launcher (47 tests, 1 optional skip, real HTTP + prune safety)
        run: python deployment/test_deployment.py -v
      - name: Live Agent client transport and token policy (9 tests)
        run: python scripts/test_live_agent_auth.py -v
      - name: Offline runtime snapshot compatibility and safety (9 tests)
        run: python deployment/test_runtime_snapshot.py -v
      - name: Render adapter is stdlib-only (AST gate)
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path
          stdlib = set(sys.stdlib_module_names) | {"tomllib"}
          bad = {}
          files = sorted(Path("render_control_adapter").glob("*.py"))
          # kernel2027 is in-repo and stdlib-only by construction: its own test
          # suite (kernel-2027/tests/test_kernel.py) asserts that, so allowing it
          # here cannot smuggle in a third-party dependency.
          siblings = {p.stem for p in files} | {"kernel2027", "_kernel_path"}
          for p in files:
              tree = ast.parse(p.read_text(encoding="utf-8"))
              for n in ast.walk(tree):
                  names = []
                  if isinstance(n, ast.Import):
                      names = [a.name.split(".")[0] for a in n.names]
                  elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                      names = [n.module.split(".")[0]]
                  for name in names:
                      if name in stdlib or name in siblings:
                          continue
                      bad.setdefault(str(p), set()).add(name)
          print("scanned", len(files), "adapter files; siblings:", sorted(siblings))
          if bad:
              print("THIRD-PARTY:", bad, file=sys.stderr); sys.exit(1)
          print("PASS: render adapter imports nothing from outside the stdlib")
          PY
      - name: Render adapter offline suite (43 tests, no network)
        run: python render_control_adapter/test_adapter.py -v
      - name: Render adapter must refuse to invent a live result
        run: |
          python - <<'PY'
          import os, subprocess, sys
          env = {k: v for k, v in os.environ.items() if k != "RENDER_API_KEY"}
          # probe.py is the Phase 0 artifact. With no key it MUST exit 2, never 0:
          # an audit that silently "passes" without credentials is a lie.
          r = subprocess.run([sys.executable, "render_control_adapter/probe.py"],
                             capture_output=True, text=True, env=env, timeout=120)
          print(r.stdout[-800:]); print(r.stderr[-400:], file=sys.stderr)
          if r.returncode != 2:
              print(f"FAIL: expected exit 2 (no key), got {r.returncode}",
                    file=sys.stderr); sys.exit(1)
          print("PASS: probe refuses to run without RENDER_API_KEY")
          PY
      - name: BrowserSkill adapter is stdlib-only (AST gate)
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path
          stdlib = set(sys.stdlib_module_names) | {"tomllib"}
          files = sorted(Path("browser_skill_adapter").glob("*.py"))
          # kernel2027 is in-repo and stdlib-only (asserted by its own suite),
          # so importing it cannot add a third-party dependency.
          siblings = {p.stem for p in files} | {"kernel2027", "_kernel_path"}
          # ONE declared cross-package import: run_local_task.py offers finished
          # DecisionRecords to the repo-local L1 memory gate (also stdlib-only).
          ALLOWED_CROSS_PACKAGE = {
              ("run_local_task.py", "memory"): "offers DecisionRecord to L1 memory/store.py",
          }
          bad = {}
          for p in files:
              tree = ast.parse(p.read_text(encoding="utf-8"))
              for n in ast.walk(tree):
                  names = []
                  if isinstance(n, ast.Import):
                      names = [a.name.split(".")[0] for a in n.names]
                  elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                      names = [n.module.split(".")[0]]
                  for name in names:
                      if name in stdlib or name in siblings:
                          continue
                      if (p.name, name) in ALLOWED_CROSS_PACKAGE:
                          print(f"  allowed cross-package import in {p.name}: "
                                f"{name} ({ALLOWED_CROSS_PACKAGE[(p.name, name)]})")
                          continue
                      bad.setdefault(str(p), set()).add(name)
          print("scanned", len(files), "browser_skill_adapter files; siblings:", sorted(siblings))
          if bad:
              print("THIRD-PARTY:", bad, file=sys.stderr); sys.exit(1)
          print("PASS: browser_skill_adapter imports nothing outside the stdlib")
          PY
      - name: BrowserSkill probe must refuse to invent a live browser (exit 2 SKIPPED)
        run: |
          python - <<'PY'
          import json, subprocess, sys
          r = subprocess.run([sys.executable, "browser_skill_adapter/probe.py", "--json"],
                             capture_output=True, text=True, timeout=30)
          print(r.stdout[-800:])
          if r.returncode != 2:
              print(f"FAIL: expected exit 2 (SKIPPED on headless runner), got {r.returncode}",
                    file=sys.stderr); sys.exit(1)
          payload = json.loads(r.stdout)
          assert payload["verdict"] == "SKIPPED" and payload["mutations_performed"] == 0
          print("PASS: BrowserSkill probe reports SKIPPED honestly on headless CI")
          PY
      - name: Local watchdog is stdlib-only (AST gate)
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path
          # A sibling module inside the SAME directory is not a dependency:
          # `import local_watchdog` from test_watchdog.py is a local import.
          # Deriving that set from the files on disk (instead of hard-coding
          # names) is what keeps this gate honest as the directory grows.
          # The first version hard-coded only the shared names and failed CI on
          # a legitimate sibling import — the gate was wrong, not the code.
          stdlib = set(sys.stdlib_module_names) | {"tomllib"}
          files = sorted(Path("monitoring").glob("*.py"))
          siblings = {p.stem for p in files}
          # ONE declared exception, and it is a deliberate architectural
          # boundary rather than a convenience: render_source.py calls the
          # separate render_control_adapter package. The Render layer must not
          # become part of the watchdog any more than it may become part of Core.
          # Declaring it here means the exception is visible and reviewable; a
          # blanket "allow anything in try/except" would hide the next one.
          ALLOWED_CROSS_PACKAGE = {
              ("render_source.py", "adapter"): "calls render_control_adapter (separate package)",
          }
          bad = {}
          for p in files:
              tree = ast.parse(p.read_text(encoding="utf-8"))
              for n in ast.walk(tree):
                  names = []
                  if isinstance(n, ast.Import):
                      names = [a.name.split(".")[0] for a in n.names]
                  elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                      names = [n.module.split(".")[0]]
                  for name in names:
                      if name in stdlib or name in siblings:
                          continue
                      if (p.name, name) in ALLOWED_CROSS_PACKAGE:
                          print(f"  allowed cross-package import in {p.name}: "
                                f"{name} ({ALLOWED_CROSS_PACKAGE[(p.name, name)]})")
                          continue
                      bad.setdefault(str(p), set()).add(name)
          print("scanned", len(files), "monitoring files; siblings:", sorted(siblings))
          if bad:
              print("THIRD-PARTY:", bad, file=sys.stderr); sys.exit(1)
          print("PASS: watchdog imports nothing outside the stdlib")
          PY
      - name: Watchdog · 44 tests incl. real-file tampering and 4 concurrent writers
        run: python monitoring/test_watchdog.py -v
      - name: Phase 2B alerting · 9 tests incl. hash-chain-safe alert/recovery
        run: python monitoring/test_phase2b.py -v
      - name: Watchdog · end-to-end against a live HTTP source that dies
        run: |
          printf '{"status":"live","deploy":"d-1"}' > monitoring/e2e_fixture.json
          python monitoring/e2e_demo.py
          rm -f monitoring/e2e_fixture.json
      - name: YAML structure must parse to complete services
        run: |
          pip install --quiet --disable-pip-version-check "pyyaml==6.0.4"
          python - <<'PY'
          import sys, yaml
          d = yaml.safe_load(open("render.yaml"))
          svcs = d.get("services") or []
          # Every service must be complete. The blueprint now carries the
          # live-agent demo and the Agent Studio, so the count is no longer
          # fixed at one; what must hold is that no service is half-declared.
          required = ("type", "name", "runtime", "startCommand")
          incomplete = [
              s.get("name", "<unnamed>")
              for s in svcs
              if not all(k in s for k in required)
          ]
          print(f"services in render.yaml: {len(svcs)}")
          if not svcs or incomplete:
              print(f"FAIL: incomplete services: {incomplete}", file=sys.stderr)
              sys.exit(1)
          for s in svcs:
              print(f"  {s['name']}: plan={s.get('plan', '?')} "
                    f"health={s.get('healthCheckPath', '-')}")
          print("PASS: every service is complete")
          PY
      - name: The Dockerfile must not COPY files that are absent
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          missing = []
          for line in Path("Dockerfile").read_text().splitlines():
              line = line.strip()
              if line.upper().startswith("COPY "):
                  for src in line.split()[1:-1]:
                      if "$" in src or "*" in src:
                          continue
                      if not Path(src.rstrip("/")).exists():
                          missing.append(src)
          if missing:
              print(f"FAIL: Dockerfile COPY sources not in repo: {missing}",
                    file=sys.stderr)
              sys.exit(1)
          print("PASS: every COPY source exists")
          PY
      - name: Boot the deployed launcher and hit /api/health
        run: |
          python3 deployment/live_server.py > /tmp/live.log 2>&1 &
          for i in $(seq 1 40); do
            if python3 -c "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8090/api/health',timeout=2)" 2>/dev/null; then
              echo "PASS: live launcher answered /api/health"; cat /tmp/live.log; exit 0
            fi
            sleep 0.5
          done
          echo "FAIL: launcher never answered"; cat /tmp/live.log; exit 1

  launch-evidence:
    name: Publish kit · regenerate every claim + verify evidence links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "20"
      - name: Every public claim must still have evidence (10 tests)
        run: python launch/test_launch_claims.py -v
      - name: Regenerate ALL measured numbers from executed commands
        run: python scripts/generate_launch_evidence.py --assert
      - name: Production case-study harness must refuse fabricated data
        run: |
          python launch/production_evidence.py --template > /tmp/empty-jobs.json
          if python launch/production_evidence.py --input /tmp/empty-jobs.json; then
            echo "FAIL: empty template was accepted — invented data could be published" >&2
            exit 1
          fi
          echo "PASS: NO EVIDENCE = NO VERIFIED SUCCESS"
      - name: Upload freshly measured launch evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: launch-evidence-${{ github.sha }}
          path: |
            launch/evidence/latest.json
            launch/evidence/REPORT.md
          if-no-files-found: error

  runtime:
    name: Runtime smoke · real servers over HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Boot the live agent and the HUD
        run: |
          set -euo pipefail
          umask 077
          if [[ -e .ember-up || -L .ember-up ]]; then
            echo "refusing pre-existing .ember-up workflow state" >&2
            exit 1
          fi
          mkdir -m 700 .ember-up
          ( set -o noclobber; printf '%s\n' 'ai-2027-ci-owned-state-v1' > .ember-up/workflow-owner )
          write_owned_pid() {
            local file="$1" pid="$2"
            [[ "$pid" =~ ^[0-9]+$ ]] || return 1
            ( umask 077; set -o noclobber; printf '%s\n' "$pid" > "$file" )
          }
          WRITE_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          READ_ID="ci-reader"
          READ_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          READ_HASHES="$(AI2027_READ_TOKEN_ID="$READ_ID" AI2027_READ_TOKEN_SECRET="$READ_SECRET" AI2027_WRITE_TOKEN="$WRITE_TOKEN" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          state = Path(".ember-up")
          os.umask(0o077)
          if state.is_symlink():
              raise SystemExit("refusing a symlinked .ember-up directory")
          state.mkdir(mode=0o700, exist_ok=True)
          if state.is_symlink() or not state.is_dir():
              raise SystemExit(".ember-up is not a real directory")
          os.chmod(state, 0o700)
          identifier = os.environ["AI2027_READ_TOKEN_ID"]
          secret = os.environ["AI2027_READ_TOKEN_SECRET"]
          writer = os.environ["AI2027_WRITE_TOKEN"]
          hashes = {identifier: hashlib.sha256(secret.encode()).hexdigest()}
          path = state / "api-credentials.json"
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
              json.dump({"read_id": identifier, "read_secret": secret,
                         "write_token": writer, "read_hashes": hashes}, handle)
              handle.write("\n")
          print(json.dumps(hashes))
          PY
          )"
          AI2027_WRITE_TOKEN="$WRITE_TOKEN" AI2027_READ_TOKEN_HASHES="$READ_HASHES" \
            AI2027_READ_ONLY=0 python live-agent/server.py --port 8090 --host 127.0.0.1 \
            > .ember-up/live-agent.log 2>&1 &
          LIVE_AGENT_PID=$!
          if ! write_owned_pid .ember-up/live-agent.pid "$LIVE_AGENT_PID"; then
            kill "$LIVE_AGENT_PID" 2>/dev/null || true
            echo "could not record the Live Agent process id" >&2
            exit 1
          fi
          python command-hud/server.py --port 8091 --host 127.0.0.1 \
            > .ember-up/command-hud.log 2>&1 &
          HUD_PID=$!
          if ! write_owned_pid .ember-up/command-hud.pid "$HUD_PID"; then
            kill "$HUD_PID" 2>/dev/null || true
            echo "could not record the Command HUD process id" >&2
            exit 1
          fi
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8090/api/health >/dev/null &&
               curl -sf http://127.0.0.1:8091/api/health >/dev/null; then
              echo "both servers answered after $i tries"
              exit 0
            fi
            sleep 0.5
          done
          echo "servers did not start within 20s" >&2
          tail -30 .ember-up/live-agent.log 2>/dev/null || true
          tail -30 .ember-up/command-hud.log 2>/dev/null || true
          exit 1
      - name: End-to-end smoke against the running servers (17 checks)
        run: python scripts/runtime_smoke.py
      - name: Process restart persistence (Live Agent + Command HUD)
        run: python scripts/test_runtime_restart.py -v
      - name: Stop services and remove ephemeral credentials
        if: always()
        run: |
          set -euo pipefail
          stop_owned_service() {
            local pid_file="$1" expected="$2" pid command
            [[ ! -L "$pid_file" && -f "$pid_file" && -r "$pid_file" ]] || return 0
            read -r pid < "$pid_file" || return 0
            [[ "$pid" =~ ^[0-9]+$ ]] || return 0
            command="$(ps -p "$pid" -o args= 2>/dev/null || true)"
            case "$command" in
              *"$expected"*) kill "$pid" 2>/dev/null || true ;;
              *) return 0 ;;
            esac
            for _ in $(seq 1 20); do
              command="$(ps -p "$pid" -o args= 2>/dev/null || true)"
              case "$command" in *"$expected"*) sleep 0.1 ;; *) break ;; esac
            done
            command="$(ps -p "$pid" -o args= 2>/dev/null || true)"
            case "$command" in
              *"$expected"*) kill -KILL "$pid" 2>/dev/null || true ;;
            esac
          }
          if [[ -L .ember-up ]]; then
            echo "refusing symlinked .ember-up during cleanup" >&2
          elif [[ -d .ember-up && ! -L .ember-up \
                && -f .ember-up/workflow-owner && ! -L .ember-up/workflow-owner \
                && "$(cat .ember-up/workflow-owner)" == "ai-2027-ci-owned-state-v1" ]]; then
            stop_owned_service .ember-up/live-agent.pid 'live-agent/server.py'
            stop_owned_service .ember-up/command-hud.pid 'command-hud/server.py'
            rm -f .ember-up/api-credentials.json .ember-up/live-agent.pid \
              .ember-up/command-hud.pid .ember-up/live-agent.log \
              .ember-up/command-hud.log .ember-up/workflow-owner
            rmdir .ember-up 2>/dev/null || true
          else
            echo "no owned .ember-up workflow state to clean" >&2
          fi

  live-gemini:
    # Provider quota is always opt-in. Pushes and PRs stay offline; a manual
    # dispatch or reusable caller must explicitly select this check on main.
    name: Live Gemini call · opt-in (needs GEMINI_API_KEY)
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        github.event_name != 'pull_request' &&
        inputs.run_live_gemini
      }}
    uses: ./.github/workflows/gemini-live-check.yml
    with:
      require_credential: ${{ inputs.run_live_gemini }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
