# Carry the webhook secrets that live in GitHub Actions into Supabase Vault.
#
# GitHub secrets are write-only — only a workflow run can read them. This run
# authenticates to the Supabase edge function with a GitHub-signed OIDC token
# (no shared credential exists anywhere). The edge function accepts the token
# ONLY when it says: repo id 1460619599, refs/heads/main, this exact file,
# workflow_dispatch. Then it stores the 4 allowlisted values in Vault and
# returns their SHA-256 digests; the script compares them and probes the live
# webhook (signed -> 200, forged -> 401). Values are never printed.
#
# Manual only: Actions -> "Sync webhook secrets to Supabase Vault" -> Run workflow (main).
name: Sync webhook secrets to Supabase Vault

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Presence report only (no network, nothing imported)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: supabase-secret-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: Import allowlisted secrets via GitHub OIDC and prove them live
        env:
          YCLOUD_WEBHOOK_SECRET: ${{ secrets.YCLOUD_WEBHOOK_SECRET }}
          WHATSAPP_CLOUD_APP_SECRET: ${{ secrets.WHATSAPP_CLOUD_APP_SECRET }}
          WHATSAPP_CLOUD_VERIFY_TOKEN: ${{ secrets.WHATSAPP_CLOUD_VERIFY_TOKEN }}
          AI2027_WHATSAPP_WEBHOOK: ${{ secrets.AI2027_WHATSAPP_WEBHOOK }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            python3 scripts/supabase_secret_sync.py --dry-run
          else
            python3 scripts/supabase_secret_sync.py
          fi
