# Carry the webhook and CELIA secrets that live in GitHub Actions into Supabase Vault.
#
# GitHub secrets are write-only — only a workflow run can read them. This run
# authenticates to the Supabase edge function with a GitHub-signed OIDC token
# (no shared credential exists anywhere). The edge function accepts the token
# ONLY when it says: repo id 1460619599, refs/heads/main, this exact file,
# workflow_dispatch. Then it stores the allowlisted values in Vault and
# returns their SHA-256 digests; the script compares them and probes the live
# webhook (signed -> 200, forged -> 401). Values are never printed.
#
# CELIA: the celia-telegram function reads CELIA_TELEGRAM_TOKEN (= the approval
# bot's own token, so both sides derive the same relay/webhook secrets) and the
# free model keys from Vault; proven via its /healthz (token from Vault,
# accepted by Telegram, providers configured). The gates CELIA_WEBHOOK and
# CELIA_CHAT are deliberately NOT carried: a human sets them in Supabase.
#
# Manual only: Actions -> "Sync webhook secrets to Supabase Vault" -> Run workflow (main).
#
# ycloud_api=true (needs the YCLOUD_API_KEY secret): instead of a hand-copied
# YCLOUD_WEBHOOK_SECRET, find the YCloud webhook endpoint that points at our
# Supabase URL — or create it, subscribed to inbound WhatsApp messages — and
# import THAT endpoint's signing secret. The secret is never written to the
# log (not even for masking) and only travels YCloud -> runner -> Vault (OIDC).
name: Sync webhook secrets to Supabase Vault

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Presence report only (no network, nothing imported)"
        type: boolean
        default: false
      ycloud_api:
        description: "Take YCLOUD_WEBHOOK_SECRET from the YCloud API (find or create our endpoint; needs YCLOUD_API_KEY)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: supabase-secret-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: Import allowlisted secrets via GitHub OIDC and prove them live
        env:
          YCLOUD_WEBHOOK_SECRET: ${{ secrets.YCLOUD_WEBHOOK_SECRET }}
          WHATSAPP_CLOUD_APP_SECRET: ${{ secrets.WHATSAPP_CLOUD_APP_SECRET }}
          WHATSAPP_CLOUD_VERIFY_TOKEN: ${{ secrets.WHATSAPP_CLOUD_VERIFY_TOKEN }}
          AI2027_WHATSAPP_WEBHOOK: ${{ secrets.AI2027_WHATSAPP_WEBHOOK }}
          YCLOUD_API_KEY: ${{ secrets.YCLOUD_API_KEY }}
          CELIA_TELEGRAM_TOKEN: ${{ secrets.PA_APPROVAL_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          YCLOUD_API: ${{ inputs.ycloud_api }}
        run: |
          set -euo pipefail
          args=()
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          if [ "${YCLOUD_API}" = "true" ]; then args+=(--ycloud-api); fi
          python3 scripts/supabase_secret_sync.py "${args[@]}"
