# One small, opt-in Gemini endpoint check. The reusable workflow is also used
# by CI and the project lifecycle so the credential stays isolated to this job.
name: Gemini live smoke check

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model ID (non-secret; defaults to GEMINI_MODEL)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      model:
        description: "Gemini model ID (non-secret; defaults to GEMINI_MODEL)"
        required: false
        type: string
        default: ""
      require_credential:
        description: "Fail instead of skip when an orchestrator explicitly requires the check"
        required: false
        type: boolean
        default: false
    secrets:
      GEMINI_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: gemini-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: One tiny Gemini call
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - name: Restrict live provider access to main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Live Gemini checks are restricted to main. No provider credential was used."
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: One request — tiny prompt, header auth, no retries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model || vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          REQUIRE_CREDENTIAL: ${{ inputs.require_credential }}
        run: |
          set +x
          set +e
          python scripts/gemini_live_check.py --json > /tmp/gemini.json 2>/tmp/gemini.err
          rc=$?
          set -e
          cat /tmp/gemini.json
          python - <<'PY'
          import json, pathlib
          raw = pathlib.Path("/tmp/gemini.json").read_text().strip()
          try:
              d = json.loads(raw)
          except ValueError:
              raise SystemExit("the check produced no JSON — see the log above")
          lines = ["### 🧪 Live Gemini call",
                   "",
                   f"- model: `{d.get('model')}` · credential: `{d.get('credential')}`",
                   f"- result: **{d.get('error_kind') or 'ok'}** · status {d.get('status')} · "
                   f"{d.get('latency_ms')} ms",
                   f"- claim: {d.get('claim')}"]
          if d.get("ok"):
              lines.append(f"- answer: `{d.get('text_preview')}` "
                           f"({d.get('text_chars')} chars)")
          pathlib.Path("/tmp/gemini.md").write_text("\n".join(lines) + "\n")
          PY
          cat /tmp/gemini.md >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) echo "live Gemini call succeeded" ;;
            2)
              if [ "${REQUIRE_CREDENTIAL:-false}" = "true" ]; then
                echo "::error::GEMINI_API_KEY is required for this explicitly requested provider check"
                exit 1
              fi
              echo "::notice::GEMINI_API_KEY is not configured — live call SKIPPED (this is not a failure)"
              ;;
            3) echo "::error::no general egress from this runner — the call was BLOCKED, not failed" ; exit 1 ;;
            *) echo "::error::the live call failed (key invalid, quota exhausted, or model unavailable) — see /tmp/gemini.json" ; cat /tmp/gemini.err || true ; exit 1 ;;
          esac
