name: NVIDIA NIM live smoke check

on:
  workflow_dispatch:
    inputs:
      model:
        description: NVIDIA NIM model ID (not a secret)
        required: true
        type: string
  workflow_call:
    inputs:
      model:
        description: NVIDIA NIM model ID (not a secret)
        required: false
        type: string
        default: ""
      require_credential:
        description: "Fail instead of skip if the caller explicitly requires this smoke test"
        required: false
        type: boolean
        default: false
    secrets:
      NVIDIA_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: nvidia-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nvidia-live-check:
    name: One tiny NVIDIA NIM request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - name: Restrict live provider access to main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Live NVIDIA checks are restricted to main. No provider credential was used."
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: One minimal request (secret is env-only; no retries)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ inputs.model || vars.NVIDIA_MODEL || '' }}
          REQUIRE_CREDENTIAL: ${{ inputs.require_credential }}
        run: |
          set -euo pipefail
          set +e
          python scripts/nvidia_live_check.py --json > "$RUNNER_TEMP/nvidia-live.json"
          result=$?
          set -e
          cat "$RUNNER_TEMP/nvidia-live.json"
          python - "$RUNNER_TEMP/nvidia-live.json" "$result" <<'PY'
          import json, os, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").strip()
          rc = int(sys.argv[2])
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
          try:
              d = json.loads(raw)
          except ValueError:
              print("::error title=NVIDIA NIM live check::Check produced invalid JSON")
              raise SystemExit(0)
          lines = [
              "### 🧪 Live NVIDIA NIM call",
              "",
              f"- model: `{d.get('model')}` · credential: `{d.get('credential')}`",
              f"- result: **{d.get('error_kind') or 'ok'}** · status `{d.get('status')}` · {d.get('latency_ms')} ms",
              f"- claim: {d.get('claim')}",
          ]
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          if rc == 0:
              print(
                  f"::notice title=NVIDIA NIM live check::ok model={d.get('model')} "
                  f"status={d.get('status')} latency={d.get('latency_ms')}ms"
              )
          elif rc != 2:
              print(
                  f"::error title=NVIDIA NIM live check::model={d.get('model')} "
                  f"status={d.get('status')} error_kind={d.get('error_kind')}"
              )
          PY
          if [ "$result" -eq 2 ]; then
            if [ "${REQUIRE_CREDENTIAL:-false}" = "true" ]; then
              echo "::error::NVIDIA_API_KEY is required for this explicitly requested provider check."
              exit 1
            fi
            echo "::notice::NVIDIA_API_KEY is not configured — live check skipped."
            exit 0
          fi
          exit "$result"
