name: NVIDIA NIM live smoke check

on:
  workflow_dispatch:
    inputs:
      model:
        description: NVIDIA NIM model ID (not a secret)
        required: true
        type: string
  workflow_call:
    inputs:
      model:
        description: NVIDIA NIM model ID (not a secret)
        required: false
        type: string
        default: ""
      require_credential:
        description: "Fail instead of skip if the caller explicitly requires this smoke test"
        required: false
        type: boolean
        default: false
    secrets:
      NVIDIA_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: nvidia-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nvidia-live-check:
    name: One tiny NVIDIA NIM request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Restrict live provider access to main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Live NVIDIA checks are restricted to main. No provider credential was used."
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: One minimal request (secret is env-only; no retries)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ inputs.model || vars.NVIDIA_MODEL || '' }}
          REQUIRE_CREDENTIAL: ${{ inputs.require_credential }}
        run: |
          set -euo pipefail
          set +e
          python scripts/nvidia_live_check.py --json > "$RUNNER_TEMP/nvidia-live.json"
          result=$?
          set -e
          cat "$RUNNER_TEMP/nvidia-live.json"
          if [ "$result" -eq 2 ]; then
            if [ "${REQUIRE_CREDENTIAL:-false}" = "true" ]; then
              echo "::error::NVIDIA_API_KEY is required for this explicitly requested provider check."
              exit 1
            fi
            echo "::notice::NVIDIA_API_KEY is not configured — live check skipped."
            exit 0
          fi
          exit "$result"
