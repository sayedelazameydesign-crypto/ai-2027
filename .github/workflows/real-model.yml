# Run the quality benchmark against a real model, using a provider that is
# provably free. This file exists because of a specific gap: `run_real_model.py`
# could only ever run on a laptop with Ollama, so the one number that matters —
# how a real model scores against the 0.5783 scaffold — had never been produced.
#
# Three rules this workflow keeps:
#   1. It runs on `main` only. A pull request never spends, never calls a
#      network provider, and never needs the secret.
#   2. The model must be provably free (`openrouter/free` or `*:free`). The
#      script enforces that itself; this file does not rely on remembering it.
#   3. The key comes from the repository secret and is never echoed. The script
#      only ever prints the model name and latency.
name: Real model benchmark · free provider, main only

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id (must be 'openrouter/free' or end with ':free')"
        required: false
        type: string
        default: "openrouter/free"
      require_live:
        description: "Fail instead of skipping when OPENROUTER_API_KEY is absent"
        required: false
        type: boolean
        default: false
  # Manual only. An earlier version also ran on every push that touched this
  # file or bench/**, which meant each merged pull request spent a slice of a
  # 50-request daily quota. Ten PRs later the quota was gone and the numbers
  # fell from 0.7850 to 0.0281 for reasons that had nothing to do with the
  # model. A measurement is a deliberate act, not a side effect of pushing.

permissions:
  contents: read

concurrency:
  group: real-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: Measure a real model against the scaffold baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      # The fleet package is stdlib-only; nothing to install.
      - name: Refuse to run anywhere but main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::this workflow measures a real model and is restricted to main"
            exit 1
          fi
      - name: Decide whether the run is possible
        id: gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REQUIRE_LIVE: ${{ inputs.require_live }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            if [ "${REQUIRE_LIVE}" = "true" ]; then
              echo "::error::OPENROUTER_API_KEY is absent and this run was told to require it"
              exit 1
            fi
            echo "::notice::OPENROUTER_API_KEY absent — real-model measurement SKIPPED (not a failure)"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      # Diagnose before measuring. "It failed" is not a finding; knowing
      # whether a tap is unreachable, or reached and told no, is the difference
      # between a fix and a guess. Every tap is probed, because any of them may
      # be the one that measures.
      - name: Diagnose reachability and credential shape (no secret printed)
        id: diagnose
        if: steps.gate.outputs.available == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          # `python | tee` returns tee's status. Without pipefail a diagnostic
          # that crashed halfway would read as a diagnostic that ran.
          set -o pipefail
          echo "### Reachability diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'TAPS' | tee /tmp/diag.txt
          import os
          import socket
          import ssl
          import urllib.error
          import urllib.request

          TAPS = [
              ("openrouter", "openrouter.ai", "OPENROUTER_API_KEY",
               "https://openrouter.ai/api/v1/models", "sk-or-"),
              ("gemini", "generativelanguage.googleapis.com", "GEMINI_API_KEY",
               "https://generativelanguage.googleapis.com/v1beta/openai/models", None),
              ("nvidia", "integrate.api.nvidia.com", "NVIDIA_API_KEY",
               "https://integrate.api.nvidia.com/v1/models", None),
          ]

          for name, host, key_env, probe_url, prefix in TAPS:
              key = os.environ.get(key_env, "")
              shape = f"present={bool(key)} len={len(key)}"
              if prefix:
                  shape += f" prefix_ok={key.startswith(prefix)}"
              print(f"[{name}] key {shape}")
              if not key:
                  print(f"[{name}] skipped: no credential")
                  continue
              try:
                  socket.gethostbyname(host)
              except OSError as exc:
                  print(f"[{name}] dns FAILED ({type(exc).__name__})")
                  continue
              try:
                  ctx = ssl.create_default_context()
                  with socket.create_connection((host, 443), timeout=15) as sock:
                      with ctx.wrap_socket(sock, server_hostname=host) as tls:
                          print(f"[{name}] tls ok ({tls.version()})")
              except Exception as exc:  # noqa: BLE001 - diagnostic must not crash
                  print(f"[{name}] tls FAILED ({type(exc).__name__}: {exc})")
                  continue
              req = urllib.request.Request(
                  probe_url, headers={"Authorization": f"Bearer {key}"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      print(f"[{name}] GET models http {resp.status}")
              except urllib.error.HTTPError as exc:
                  print(f"[{name}] GET models http {exc.code} (body omitted)")
              except Exception as exc:  # noqa: BLE001 - diagnostic must not crash
                  print(f"[{name}] GET models FAILED ({type(exc).__name__}: {exc})")
          TAPS
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Annotations are the channel confirmed readable by an API client.
          while IFS= read -r line; do
            echo "::warning::${line}"
          done < /tmp/diag.txt

      # One call per tap, before the benchmark. A provider can pass a models
      # listing and still refuse a chat completion (wrong model id, no quota,
      # region block). This asks each one to answer, so a dead tap is named
      # with its status instead of being inferred from 24 failed sentences.
      - name: Ask each tap to answer one word
        id: smoke
        if: steps.gate.outputs.available == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          # Same reason: a traceback piped through tee is a zero exit code.
          set -o pipefail
          python3 - <<'SMOKE' | tee /tmp/smoke.txt
          import json
          import os
          import urllib.error
          import urllib.request

          TAPS = [
              ("openrouter", "OPENROUTER_API_KEY", "openrouter/free",
               "https://openrouter.ai/api/v1/chat/completions"),
              ("gemini", "GEMINI_API_KEY", "gemini-2.5-flash",
               "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"),
              ("nvidia", "NVIDIA_API_KEY", "z-ai/glm-5.3-flash",
               "https://integrate.api.nvidia.com/v1/chat/completions"),
          ]
          for name, key_env, model, url in TAPS:
              key = os.environ.get(key_env, "")
              if not key:
                  print(f"[{name}] skipped (no {key_env})")
                  continue
              body = json.dumps({
                  "model": model,
                  "messages": [{"role": "user", "content": "Reply with one word: ready"}],
                  "max_tokens": 512,
                  "temperature": 0,
              }).encode()
              req = urllib.request.Request(
                  url, data=body, method="POST",
                  headers={"Authorization": f"Bearer {key}",
                           "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      payload = json.loads(resp.read())
                  msg = payload.get("choices", [{}])[0].get("message", {})
                  text = (msg.get("content") or msg.get("reasoning") or "").strip()
                  print(f"[{name}] http {resp.status} · answered={bool(text)} "
                        f"· model={payload.get('model')}")
              except urllib.error.HTTPError as exc:
                  detail = exc.read(300).decode("utf-8", "replace")
                  print(f"[{name}] http {exc.code} · {detail[:200]}")
              except Exception as exc:  # noqa: BLE001 - diagnostic must not crash
                  print(f"[{name}] FAILED {type(exc).__name__}: {exc}")
          SMOKE
          while IFS= read -r line; do echo "::warning::${line}"; done < /tmp/smoke.txt
          # A tap that just answered a real call is the one worth starting
          # from: OpenRouter's exhausted quota does not fail one sentence, it
          # fails every sentence that depends on it. Expose the live taps so
          # the measure step can start from a healthy one.
          live=$(grep -oE '^\[[a-z]+\] http 2[0-9][0-9]' /tmp/smoke.txt \
                 | sed 's/^\[//; s/\] http.*//' | paste -sd, -)
          echo "live_taps=${live}" >> "$GITHUB_OUTPUT"
          echo "live taps: ${live:-none}"

      # Rotate the three free taps, one per sentence, so the full 24-sentence
      # corpus is measured instead of truncated to what one quota allows.
      # A tap that refuses is simply skipped for its sentences: the number is
      # still a real-model number, and the report names every tap in
      # `backend=rotate(...)`.
      - name: Measure (free taps, rotated)
        id: measure
        if: steps.gate.outputs.available == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
          # Empty when nothing answered, so the runner still tries every tap
          # rather than refusing to measure at all.
          TAPS: ${{ steps.smoke.outputs.live_taps }}
        run: |
          set -o pipefail
          set +e
          # Start from the taps that answered the smoke call, in that order.
          # OpenRouter's quota is exhausted, and handing it the first sentence
          # costs every sentence downstream of it.
          python3 scripts/run_real_model.py --rotate \
            ${TAPS:+--taps "$TAPS"} \
            --out "fleet-2027/bench/model.json" 2>&1 | tee /tmp/real_model.log
          status=${PIPESTATUS[0]}
          set -e
          echo "exit=${status}" >> /tmp/real_model.log
          echo "measured_exit=${status}" >> "$GITHUB_OUTPUT"
          reason=$(grep -m1 -E "(refusing to run|refusing to report): .*|(http_429|http_401|http_403|http_5[0-9][0-9])" /tmp/real_model.log || true)
          if [ -n "${reason}" ]; then
            echo "::error::${reason}"
          fi
          if [ "${status}" = "2" ]; then
            echo "::error::no free tap could measure; see the attempts above"
            exit 1
          fi
          exit 0

      - name: Publish the result to the job summary
        if: steps.gate.outputs.available == 'true'
        run: |
          {
            echo "## Real model benchmark"
            echo ""
            echo '```'
            tail -n 12 /tmp/real_model.log
            echo '```'
            echo ""
            echo "Baseline is the scaffold at 0.5783. The comparison is by domain,"
            echo "not only by mean, so a gain in one area cannot hide a loss in another."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the measurement
        if: steps.gate.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: real-model-report
          path: fleet-2027/bench/model.json
          retention-days: 30
      # The measurement itself must leave the job even when nothing else can be
      # fetched: the artifact lives in blob storage and the log is not always
      # reachable. An annotation is served by the API, so the number goes there.
      - name: Publish the number as an annotation
        if: steps.gate.outputs.available == 'true'
        run: |
          verdict="$(grep -E '^(baseline|RESULT)' /tmp/real_model.log | tr '\n' ' ')"
          scores="$(grep -E '^measured ' /tmp/real_model.log | head -1)"
          # `--rotate` prints "rotation: <provider> -> <model>" lines; the old
          # `attempt N:` pattern no longer exists and was silently matching
          # nothing, which is why the tap name read "model unknown".
          model="$(grep -oE 'rotation: [a-z]+ -> .*' /tmp/real_model.log | tr '\n' ',' | sed 's/,$//')"
          # Failure causes are the most useful line of a bad run.
          causes="$(grep -E '^[[:space:]]+[0-9]+x ' /tmp/real_model.log | head -3 | sed 's/^ *//' | tr '\n' ';')"
          fails="$(grep -E '^failures: ' /tmp/real_model.log | head -1)"
          echo "::warning::${model:-model unknown} | ${scores:-no measurement line} | ${verdict:-no verdict}"
          if [ -n "${fails}" ]; then
            echo "::warning::${fails} ${causes}"
          fi
          echo "verdict exit code: ${{ steps.measure.outputs.measured_exit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${verdict}" >> "$GITHUB_STEP_SUMMARY"
