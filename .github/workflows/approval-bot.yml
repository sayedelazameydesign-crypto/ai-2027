name: Approval bot · Telegram (free tier)

# Two-way Telegram approval loop over GitHub Actions secrets only
# (docs/TELEGRAM-APPROVAL-RUNBOOK.md). The Bot API is free; this public
# repo gets unlimited Actions minutes. Secrets never reach logs: values
# are passed via env and the runner prints stage names only.
#
# schedule : one cards+votes cycle every 5 min (same cadence as
#            APPROVAL_BOT_INTERVAL_SEC); card dedup + getUpdates offset
#            persist in actions/cache (.bot-state.json).
# dispatch : manual "test" proves delivery with one plain message.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = one proof message · run = full cards+votes cycle"
        type: choice
        options:
          - test
          - run
        default: test

permissions:
  contents: read

concurrency:
  group: approval-bot
  cancel-in-progress: false  # never cancel mid-vote: state must stay consistent

jobs:
  bot:
    name: ${{ github.event_name == 'schedule' && 'scheduled cycle' || 'manual run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      # TEMPORARY diagnostic (branch only): which candidate secret NAMES
      # are non-empty — names only, values never printed.
      - name: Probe secret names (temporary)
        env:
          PROBE_WAAPI_API_TOKEN: ${{ secrets.WAAPI_API_TOKEN }}
          PROBE_PA_APPROVAL_BOT_TOKEN: ${{ secrets.PA_APPROVAL_BOT_TOKEN }}
          PROBE_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PROBE_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PROBE_TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          PROBE_TELEGRAM_BOT_API_TOKEN: ${{ secrets.TELEGRAM_BOT_API_TOKEN }}
          PROBE_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PROBE_BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
          PROBE_TG_TOKEN: ${{ secrets.TG_TOKEN }}
          PROBE_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          PROBE_CELIA_BOT_TOKEN: ${{ secrets.CELIA_BOT_TOKEN }}
          PROBE_CELIA_TOKEN: ${{ secrets.CELIA_TOKEN }}
          PROBE_CELIA_TELEGRAM_TOKEN: ${{ secrets.CELIA_TELEGRAM_TOKEN }}
          PROBE_CELIAFASHIONBOT_TOKEN: ${{ secrets.CELIAFASHIONBOT_TOKEN }}
          PROBE_CELIA_FASHION_BOT_TOKEN: ${{ secrets.CELIA_FASHION_BOT_TOKEN }}
          PROBE_CELIAFASHION_BOT_TOKEN: ${{ secrets.CELIAFASHION_BOT_TOKEN }}
          PROBE_FASHION_BOT_TOKEN: ${{ secrets.FASHION_BOT_TOKEN }}
          PROBE_FASHIONBOT_TOKEN: ${{ secrets.FASHIONBOT_TOKEN }}
          PROBE_PA_APPROVAL_TOKEN: ${{ secrets.PA_APPROVAL_TOKEN }}
          PROBE_APPROVAL_BOT_TOKEN: ${{ secrets.APPROVAL_BOT_TOKEN }}
          PROBE_PA_BOT_TOKEN: ${{ secrets.PA_BOT_TOKEN }}
          PROBE_PA_TELEGRAM_BOT_TOKEN: ${{ secrets.PA_TELEGRAM_BOT_TOKEN }}
          PROBE_TELEGRAM_BOT_KEY: ${{ secrets.TELEGRAM_BOT_KEY }}
          PROBE_BOT_KEY: ${{ secrets.BOT_KEY }}
          PROBE_API_TOKEN: ${{ secrets.API_TOKEN }}
          PROBE_TOKEN: ${{ secrets.TOKEN }}
          PROBE_MY_BOT_TOKEN: ${{ secrets.MY_BOT_TOKEN }}
          PROBE_BOT_FATHER_TOKEN: ${{ secrets.BOT_FATHER_TOKEN }}
          PROBE_BOTFATHER_TOKEN: ${{ secrets.BOTFATHER_TOKEN }}
          PROBE_PA_APPROVAL_CHAT_ID: ${{ secrets.PA_APPROVAL_CHAT_ID }}
          PROBE_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROBE_CHAT_ID: ${{ secrets.CHAT_ID }}
          PROBE_CELIA_CHAT_ID: ${{ secrets.CELIA_CHAT_ID }}
        run: |
          found=""
          for var in $(compgen -e | grep '^PROBE_'); do
            if [ -n "${!var}" ]; then
              found="${found}${found:+ · }${var#PROBE_}"
            fi
          done
          if [ -n "$found" ]; then
            echo "::notice title=secret-name-probe::NON-EMPTY: ${found}"
          else
            echo "::notice title=secret-name-probe::NONE of the candidates exist"
          fi

      - name: Restore bot state (sent cards + Telegram offset)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .bot-state.json
          key: approval-bot-state-${{ github.run_id }}
          restore-keys: |
            approval-bot-state-

      - name: Install runtime deps
        run: python3 -m pip install --quiet gspread google-auth google-api-python-client

      - name: Run (fail-closed preflight; secrets stay in env only)
        env:
          # Either naming works: canonical .env.example keys or TELEGRAM_*.
          PA_APPROVAL_BOT_TOKEN: ${{ secrets.PA_APPROVAL_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          PA_APPROVAL_CHAT_ID: ${{ secrets.PA_APPROVAL_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          PA_APPROVAL_ALLOWED_SENDERS: ${{ secrets.PA_APPROVAL_ALLOWED_SENDERS || secrets.TELEGRAM_ALLOWED_SENDERS }}
          PA_MEMORY_SHEET_ID: ${{ secrets.PA_MEMORY_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PA_APPROVAL_API_BASE: https://api.telegram.org
          PA_WAAPI_NOTIFY: "0"  # WhatsApp companion stays off (paid tier)
          BOT_STATE_FILE: .bot-state.json
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/approval_bot_ci.py --mode "${{ inputs.mode }}"
          else
            python3 scripts/approval_bot_ci.py --mode run
          fi
