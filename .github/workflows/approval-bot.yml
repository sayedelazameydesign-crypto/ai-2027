name: Approval bot · Telegram (free tier)

# Each scheduled run polls one cards+votes cycle; it is not a live listener.
# Preflight is stdlib-only and must succeed before installing dependencies.
# Secrets stay in env. Failure handling never calls Telegram diagnostics.
# State cache is best-effort, not an exactly-once delivery guarantee.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = proof message · run = cards+votes · welcome = auto-reply"
        type: choice
        options:
          - test
          - run
          - welcome
        default: test

permissions:
  contents: read

concurrency:
  group: approval-bot
  cancel-in-progress: false  # never cancel mid-vote

jobs:
  bot:
    name: ${{ github.event_name == 'schedule' && 'scheduled cycle' || 'manual run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'run' }}
      PA_APPROVAL_BOT_TOKEN: ${{ secrets.PA_APPROVAL_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      PA_APPROVAL_CHAT_ID: ${{ secrets.PA_APPROVAL_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
      PA_APPROVAL_ALLOWED_SENDERS: ${{ secrets.PA_APPROVAL_ALLOWED_SENDERS || secrets.TELEGRAM_ALLOWED_SENDERS }}
      PA_MEMORY_SHEET_ID: ${{ secrets.PA_MEMORY_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PA_APPROVAL_API_BASE: https://api.telegram.org
      PA_WAAPI_NOTIFY: "0"  # paid WhatsApp companion stays off
      BOT_STATE_FILE: .bot-state.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: Preflight (no network or runtime dependencies)
        run: python3 scripts/approval_bot_ci.py --mode "$BOT_MODE" --preflight-only

      - name: Restore bot state (sent cards + Telegram offset)
        if: env.BOT_MODE == 'run'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .bot-state.json
          key: approval-bot-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            approval-bot-state-

      - name: Install runtime deps
        run: python3 -m pip install --quiet gspread google-auth google-api-python-client

      - name: Run (fail-closed; secrets stay in env only)
        id: cycle
        run: python3 scripts/approval_bot_ci.py --mode "$BOT_MODE"

      # The runner preserves sent-card progress and the OLD offset on failure.
      # Combined actions/cache only saves after success; explicitly save here
      # even when the cycle failed. Do not save after skipped/preflight steps.
      - name: Save bot progress (including failed cycles)
        if: ${{ always() && env.BOT_MODE == 'run' && (steps.cycle.outcome == 'success' || steps.cycle.outcome == 'failure') && hashFiles('.bot-state.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .bot-state.json
          key: approval-bot-state-${{ github.run_id }}-${{ github.run_attempt }}

      # No curl, webhook changes, getUpdates or chat discovery on failure.
      # Manual recovery must first establish the intended bot/chat consumer.
