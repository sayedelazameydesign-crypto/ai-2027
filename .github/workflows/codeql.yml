# Static analysis (CodeQL) — the "someone else reads every diff" a solo repo
# cannot hire. Runs on PRs, on main, and weekly so a newly disclosed query pack
# still finds old code.
#
# Pinned to a full-length SHA because this repository enforces that policy on
# itself (scripts/sbom.py --assert-pinned proves it mechanically).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "40 3 * * 1"   # Mondays, 03:40 UTC

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4
        with:
          category: "/language:${{ matrix.language }}"
