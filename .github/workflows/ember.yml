# 🔥 Ember beat — the workflow that keeps this repository burning without a human.
#
# Why it exists: measured on 2026-11-17, `grep -rn "schedule|cron" .github/workflows/`
# returned NOTHING. The project only moved when someone pushed. A repo that stops
# when its owner sleeps is a hot stone, not an ember.
#
# What each run does (all of it real, none of it simulated):
#   1. boots the real live-agent (real kernel) + the real Command HUD;
#   2. runs `scripts/runtime_smoke.py` (15 checks over real HTTP);
#   3. computes the Heat Index from measured history and writes ember/status.json
#      + STATUS.md from the same variables;
#   4. judges that beat with `scripts/health_gate.py` against the recorded past —
#      a beat that lost checks, went stale, or whose memory stopped answering is
#      degraded even when its own fields look fine;
#   5. escalation ladder: one retry → one issue → stage-3 escalation (label +
#      code-owner mention + optional webhook);
#   6. closes the issue on recovery and pushes a heartbeat commit.
#
# Two honest constraints are handled here, not hidden:
#   * GitHub disables `schedule:` on public repos after ~60 days without repo
#     activity — the heartbeat commit is the fuel that keeps the cron alive;
#   * a scheduled job is NOT an uptime SLA (GitHub delays cron under load), so the
#     status is published as measured fact with timestamps, never as "always up".
name: Ember beat

on:
  schedule:
    - cron: "15 */6 * * *"      # 04 beats/day, offset from the hour to dodge load
  workflow_dispatch:
    inputs:
      force_degraded:
        description: "Deliberately produce a degraded beat (proves the issue loop end-to-end)"
        type: boolean
        default: false

permissions:
  contents: write      # heartbeat branch + status files
  issues: write        # degraded/recovered issue
  actions: read

concurrency:
  group: ember-beat
  cancel-in-progress: false

jobs:
  beat:
    name: One measured beat (real servers, real HTTP, gated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional: when the owner configures this secret, stage-3 failures are
      # POSTed to it. Unset is not a failure — the gate says "not-configured".
      EMBER_ALERT_WEBHOOK: ${{ secrets.EMBER_ALERT_WEBHOOK }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Boot the real services
        run: |
          set -euo pipefail
          python live-agent/server.py --port 8090 --host 127.0.0.1 > /tmp/live-agent.log 2>&1 &
          python command-hud/server.py --port 8091 --host 127.0.0.1 > /tmp/hud.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8090/api/health > /dev/null \
               && curl -sf http://127.0.0.1:8091/api/health > /dev/null; then
              echo "both services healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::services did not become healthy in 30s"
          tail -40 /tmp/live-agent.log /tmp/hud.log || true
          exit 1

      - name: Restore the recorded past (history lives on the heartbeat branch)
        run: |
          # The beat's memory is not in `main` (ember/ is intentionally ignored
          # there): it is published to the `heartbeat` branch. Without this step
          # every run starts with an empty history, the streak can never grow,
          # and stage-3 escalation would be unreachable. Found by running it.
          set -euo pipefail
          mkdir -p ember
          : > ember/history.jsonl
          : > ember/gate.jsonl
          if git fetch --depth=1 origin heartbeat 2>/dev/null; then
            git show FETCH_HEAD:ember/history.jsonl > ember/history.jsonl 2>/dev/null || true
            git show FETCH_HEAD:ember/gate.jsonl   > ember/gate.jsonl   2>/dev/null || true
            echo "restored the past from origin/heartbeat"
          else
            echo "no heartbeat branch yet — this is the first beat on record"
          fi
          echo "history rows: $(wc -l < ember/history.jsonl) · gate rows: $(wc -l < ember/gate.jsonl)"

      - name: Beat, then gate it — one retry before any human is paged
        id: gate
        run: |
          set +e
          EXTRA=""
          if [ "${{ inputs.force_degraded }}" = "true" ]; then
            echo "::warning::force_degraded=true — skipping the smoke on purpose"
            EXTRA="--no-smoke"
          fi
          attempt=1
          while : ; do
            # The beat rewrites the status files but does NOT touch history:
            # history is committed by the gate, once, on the final attempt.
            python scripts/ember_beat.py --write --no-history --json $EXTRA \
              --live-agent http://127.0.0.1:8090 \
              --hud http://127.0.0.1:8091 \
              --pages-url "https://sayedelazameydesign-crypto.github.io/ai-2027/demo.html" \
              --pages-url "https://cdn.jsdelivr.net/gh/sayedelazameydesign-crypto/ai-2027@main/website/demo.html" \
              > /tmp/beat.json
            python scripts/health_gate.py \
              --status ember/status.json \
              --history ember/history.jsonl \
              --gate-log ember/gate.jsonl \
              --commit-beat --write --json --attempt "$attempt" \
              > /tmp/gate.json
            rc=$?
            echo "attempt ${attempt}: health gate exit ${rc}"
            cat /tmp/gate.json
            if [ "$rc" -eq 0 ]; then break; fi
            if [ "$rc" -eq 2 ] && [ "$attempt" -eq 1 ]; then
              echo "::warning::transient signal — retrying the beat once (stage 1)"
              attempt=2; sleep 15; continue
            fi
            break
          done
          echo "$rc" > /tmp/gate_exit
          echo "$attempt" > /tmp/gate_attempt
          exit 0

      - name: Publish the measurement to the job summary
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib

          def load(p, default):
              f = pathlib.Path(p)
              try:
                  return json.loads(f.read_text() or "null") or default
              except (OSError, ValueError):
                  return default

          def load_text(p, default):
              try:
                  return pathlib.Path(p).read_text().strip() or default
              except OSError:
                  return default

          beat = load("/tmp/beat.json", {})
          gate = load("/tmp/gate.json", {})
          smoke = beat.get("smoke", {})
          heat = beat.get("heat", {})
          body = [
              f"### 🔥 Ember beat — {gate.get('verdict', '?')} "
              f"(stage {gate.get('stage', '?')}/3)",
              f"- smoke: **{smoke.get('passed')}/{smoke.get('total')}**",
              f"- heat: **{heat.get('heat')}** ({heat.get('verdict')}) · "
              f"embers live {heat.get('embers_live')}/3",
              f"- memories: {(beat.get('memory') or {}).get('memories')}",
              f"- attempts: {load_text('/tmp/gate_attempt', '?')} · "
              f"streak {gate.get('streak')} degraded run(s)",
              f"- alert: {gate.get('alert')}",
          ]
          if gate.get("failures"):
              body.append("- failures: " + ", ".join(f"`{f}`" for f in gate["failures"]))
          body += ["", "| check | verdict | detail |", "|---|---|---|"]
          for c in gate.get("checks", []):
              body.append(f"| `{c['id']}` | {'PASS' if c['ok'] else 'FAIL'} | {c['detail']} |")
          body.append("")
          body.append("Evidence: `ember/status.json`, `ember/gate.jsonl`, "
                      "`ember/beat.json` (workflow artifact).")
          pathlib.Path("/tmp/issue_body.md").write_text("\n".join(body))
          print("\n".join(body))
          PY
          cat /tmp/issue_body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Declare failure honestly if the gate says so
        run: |
          rc=$(cat /tmp/gate_exit)
          if [ "$rc" -ne 0 ]; then
            echo "::error::ember degraded (stage $(python -c "import json;print(json.load(open('/tmp/gate.json'))['stage'])"))"
            exit 1
          fi
          echo "healthy beat"

      - name: Upload beat evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: ember-beat-${{ github.run_id }}
          path: |
            ember/status.json
            ember/history.jsonl
            ember/gate.jsonl
            STATUS.md
            /tmp/beat.json
            /tmp/gate.json
          if-no-files-found: warn

      - name: Open or update the degraded issue (stages 2–3)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create ember-degraded --color B60205 \
            --description "Ember beat degraded — opened automatically" 2>/dev/null || true
          body_file=/tmp/issue_body.md
          [ -f "$body_file" ] || echo "the beat did not produce a body" > "$body_file"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '\n\n---\nRun: %s\n' "$run_url" >> "$body_file"
          existing=$(gh issue list --label ember-degraded --state open \
                     --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body_file"
            echo "updated issue #$existing"
          else
            gh issue create --label ember-degraded \
              --title "🔥 Ember degraded — the health gate refused a beat" \
              --body-file "$body_file"
          fi

      - name: Escalate to stage 3 when the same degradation survives three runs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage=$(python -c "import json;print(json.load(open('/tmp/gate.json'))['stage'])")
          if [ "$stage" -lt 3 ]; then
            echo "stage $stage — no escalation yet (needs 3 consecutive degraded runs)"
            exit 0
          fi
          gh label create escalation/s3 --color 8B0000 \
            --description "Same degradation in 3 consecutive beats" 2>/dev/null || true
          owner=$(grep -Eo '@[A-Za-z0-9-]+' .github/CODEOWNERS | head -1 || true)
          existing=$(gh issue list --label ember-degraded --state open \
                     --json number --jq '.[0].number // empty')
          [ -n "$existing" ] || { echo "no open issue to escalate"; exit 0; }
          gh issue edit "$existing" --add-label escalation/s3
          failures=$(python -c "import json;print(', '.join(json.load(open('/tmp/gate.json'))['failures']))")
          alert=$(python -c "import json;print(json.load(open('/tmp/gate.json'))['alert'])")
          cat > /tmp/escalate.md <<EOF
          ### 🚨 Stage 3 — escalated

          Three consecutive beats are degraded. $owner this needs a human.

          - alert delivery: $alert
          - failures: $failures

          Escalated by .github/workflows/ember.yml (stage 3 of scripts/health_gate.py).
          EOF
          gh issue comment "$existing" --body-file /tmp/escalate.md
          echo "escalated issue #$existing (label escalation/s3)"

      - name: Close the issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --label ember-degraded --state open \
                     --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Recovered: the health gate passed the next beat. Closed by .github/workflows/ember.yml."
            gh issue close "$existing"
            echo "closed issue #$existing"
          else
            echo "no open ember-degraded issue"
          fi

      - name: Heartbeat commit (this is what keeps the cron alive)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -d ember ]; then
            echo "no ember directory produced; nothing to publish"
            exit 0
          fi
          git config user.name  "ember-bot"
          git config user.email "ember-bot@users.noreply.github.com"
          SUMMARY=$(python -c 'import json;d=json.load(open("ember/status.json"));print("heat=%s smoke=%s/%s" % (d["heat"]["heat"], d["smoke"]["passed"], d["smoke"]["total"]))')
          # Orphan index => the branch holds ONLY the ember snapshot, so the
          # working tree (and the real branch history) is never touched.
          git checkout --orphan heartbeat-build
          git rm -r --cached . -q
          git add -f ember STATUS.md
          git -c commit.gpgsign=false commit -q -m "beat: $(date -u +%Y-%m-%dT%H:%M:%SZ) · $SUMMARY" \
            || echo "nothing changed this beat"
          git push --force origin HEAD:heartbeat
          echo "heartbeat pushed: $SUMMARY"
