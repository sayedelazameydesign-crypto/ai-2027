# Deploy the static AI-2027 site (website/) to GitHub Pages.
#
# Replaces the auto-generated Jekyll workflow, which failed on EVERY push
# (4/4 failed at "Build with Jekyll") because the site is a hand-written,
# dependency-free static bundle in website/, not a Jekyll project at the repo
# root. Building from ./ produced no index.html at the site root, so the public
# demo URL never went live.
#
# Pages is already enabled on this repo with build_type=workflow, so this
# workflow deploys on every push to main — no manual Settings → Pages step.
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      # NOTE: actions/configure-pages is deliberately NOT used: it is a composite
      # action that resolves other actions by tag, which the SHA-pinning policy
      # rejects. The site is plain static files with no base-path templating.
      - name: Validate the zero-dependency static bundle
        run: |
          set -euo pipefail
          test -f website/index.html
          test -f website/demo.html
          test -f website/kernel-demo.js
          grep -q 'demo.html' website/index.html
          grep -q 'kernel-demo.js' website/demo.html
          # No CDN / external scripts: the demo must work with zero network calls.
          if grep -nE '<script[^>]+src="https?://' website/*.html; then
            echo "FAIL: external script found in the static bundle" >&2
            exit 1
          fi
          echo "Static bundle OK: $(find website -maxdepth 1 -type f | wc -l) files, zero external scripts."
      # upload-pages-artifact is a COMPOSITE action that internally calls
      # actions/upload-artifact@v4 by TAG, so a repo that requires every action
      # to be pinned to a full-length SHA rejects it from the inside. We build
      # the exact same artifact ourselves (tar of the site root, name
      # "github-pages") and upload it with a pinned JS action instead.
      - name: Package the site as artifact.tar
        run: |
          set -euo pipefail
          tar --dereference --hard-dereference -cvf artifact.tar -C website .
          echo "artifact.tar: $(stat -c%s artifact.tar) bytes"
          tar -tf artifact.tar | head -20

      - name: Upload Pages artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: github-pages
          path: artifact.tar
          retention-days: 1

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
