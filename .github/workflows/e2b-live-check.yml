name: E2B sandbox live smoke check

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      require_credential:
        description: "Fail instead of skip if the caller explicitly requires this smoke test"
        required: false
        type: boolean
        default: false
    secrets:
      E2B_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: e2b-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2b-live-check:
    name: One temporary E2B microVM smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Restrict live provider access to main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Live E2B checks are restricted to main. No provider credential was used."
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install the project's optional E2B SDK
        working-directory: projects/open_source-
        run: python -m pip install --editable ".[sandbox]"
      - name: Run one constant expression and request sandbox cleanup
        working-directory: projects/open_source-
        timeout-minutes: 4
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          REQUIRE_CREDENTIAL: ${{ inputs.require_credential }}
        run: |
          set -euo pipefail
          set +e
          python scripts/e2b_live_check.py --json > "$RUNNER_TEMP/e2b-live.json"
          result=$?
          set -e
          cat "$RUNNER_TEMP/e2b-live.json"
          if [ "$result" -eq 2 ]; then
            if [ "${REQUIRE_CREDENTIAL:-false}" = "true" ]; then
              echo "::error::E2B_API_KEY is required for this explicitly requested provider check."
              exit 1
            fi
            echo "::notice::E2B_API_KEY is not configured — live check skipped."
            exit 0
          fi
          exit "$result"
