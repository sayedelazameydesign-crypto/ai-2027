# Release pipeline — a tag is a promise, so it ships with proof or not at all.
#
# Trigger: pushing a tag matching v*.*.*
# What it produces (all attached to the GitHub Release):
#   * the wheel built from the exact tagged commit
#   * CycloneDX SBOM (scripts/sbom.py) — every GitHub Action, pinned + verified
#   * SHA256SUMS over every asset
#   * release notes taken from CHANGELOG.md, not typed from memory
#
# It refuses to publish if the tests fail or if any action is not SHA-pinned.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Gates before any artifact exists
        run: |
          set -euo pipefail
          python -m unittest discover -s projects/agi-system/tests -t projects/agi-system
          python memory/test_memory.py
          python scripts/test_ember_beat.py
          python live-agent/test_server.py
          python command-hud/test_hud.py
          python scripts/ci_guard.py imports
          python scripts/sbom.py --assert-pinned --out /tmp/pre-sbom.json

      - name: Build the wheel from the tagged commit
        working-directory: packaging/agi-kernel
        run: |
          set -euo pipefail
          python -m pip install --upgrade "setuptools>=61" wheel
          ./build_wheel.sh
          ls -l dist/

      - name: SBOM + checksums
        run: |
          set -euo pipefail
          mkdir -p release
          cp packaging/agi-kernel/dist/*.whl release/
          python scripts/sbom.py --out release/sbom.cdx.json \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (cd release && sha256sum ./* > SHA256SUMS && cat SHA256SUMS)

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, pathlib
          tag = "${GITHUB_REF_NAME}"
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(tag)}\]\s*$(.*?)(?=^## \[|\Z)",
                        text, re.M | re.S)
          body = (m.group(1).strip() if m else
                  "No CHANGELOG entry for this tag — refusing to invent release notes.")
          pathlib.Path("release-notes.md").write_text(
              body + f"\n\n---\n\n**Assets**: wheel · `sbom.cdx.json` · `SHA256SUMS`\n"
              f"**Commit**: `{tag}`\n", encoding="utf-8")
          print(body[:400])
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            release/*.whl release/sbom.cdx.json release/SHA256SUMS
          gh release view "${GITHUB_REF_NAME}" --json tagName,assets \
            --jq '{tag:.tagName, assets:[.assets[].name]}'
