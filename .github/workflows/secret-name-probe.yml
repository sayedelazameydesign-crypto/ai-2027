name: secret-name-probe

# TEMPORARY diagnostic (branch only — never merge): reveals WHICH of a
# candidate list of secret NAMES is non-empty, as an annotation.
# VALUES are never printed, echoed, or logged — only the variable label.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe candidate names (names only)
        env:
          # Positive control — known to exist (waapi-live-probe uses it)
          PROBE_WAAPI_API_TOKEN: ${{ secrets.WAAPI_API_TOKEN }}
          # Canonical names the runner accepts (expected missing)
          PROBE_CANON_PA_APPROVAL_BOT_TOKEN: ${{ secrets.PA_APPROVAL_BOT_TOKEN }}
          PROBE_CANON_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Candidate spellings
          PROBE_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PROBE_TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          PROBE_TELEGRAM_BOT_API_TOKEN: ${{ secrets.TELEGRAM_BOT_API_TOKEN }}
          PROBE_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PROBE_BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
          PROBE_TG_TOKEN: ${{ secrets.TG_TOKEN }}
          PROBE_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          PROBE_TG_TELEGRAM_TOKEN: ${{ secrets.TG_TELEGRAM_TOKEN }}
          PROBE_CELIA_BOT_TOKEN: ${{ secrets.CELIA_BOT_TOKEN }}
          PROBE_CELIA_TOKEN: ${{ secrets.CELIA_TOKEN }}
          PROBE_CELIA_TELEGRAM_TOKEN: ${{ secrets.CELIA_TELEGRAM_TOKEN }}
          PROBE_CELIAFASHIONBOT_TOKEN: ${{ secrets.CELIAFASHIONBOT_TOKEN }}
          PROBE_CELIA_FASHION_BOT_TOKEN: ${{ secrets.CELIA_FASHION_BOT_TOKEN }}
          PROBE_CELIAFASHION_BOT_TOKEN: ${{ secrets.CELIAFASHION_BOT_TOKEN }}
          PROBE_FASHION_BOT_TOKEN: ${{ secrets.FASHION_BOT_TOKEN }}
          PROBE_FASHIONBOT_TOKEN: ${{ secrets.FASHIONBOT_TOKEN }}
          PROBE_PA_APPROVAL_TOKEN: ${{ secrets.PA_APPROVAL_TOKEN }}
          PROBE_APPROVAL_BOT_TOKEN: ${{ secrets.APPROVAL_BOT_TOKEN }}
          PROBE_PA_BOT_TOKEN: ${{ secrets.PA_BOT_TOKEN }}
          PROBE_PA_TELEGRAM_BOT_TOKEN: ${{ secrets.PA_TELEGRAM_BOT_TOKEN }}
          PROBE_TELEGRAM_BOT_KEY: ${{ secrets.TELEGRAM_BOT_KEY }}
          PROBE_BOT_KEY: ${{ secrets.BOT_KEY }}
          PROBE_API_TOKEN: ${{ secrets.API_TOKEN }}
          PROBE_TOKEN: ${{ secrets.TOKEN }}
          PROBE_MY_BOT_TOKEN: ${{ secrets.MY_BOT_TOKEN }}
          PROBE_CELIA_BOT_TELEGRAM_TOKEN: ${{ secrets.CELIA_BOT_TELEGRAM_TOKEN }}
          PROBE_BOT_FATHER_TOKEN: ${{ secrets.BOT_FATHER_TOKEN }}
          PROBE_BOTFATHER_TOKEN: ${{ secrets.BOTFATHER_TOKEN }}
          # Chat-id / senders under alternative names
          PROBE_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROBE_CHAT_ID: ${{ secrets.CHAT_ID }}
          PROBE_CELIA_CHAT_ID: ${{ secrets.CELIA_CHAT_ID }}
          PROBE_TELEGRAM_ALLOWED_SENDERS: ${{ secrets.TELEGRAM_ALLOWED_SENDERS }}
          PROBE_ALLOWED_SENDERS: ${{ secrets.ALLOWED_SENDERS }}
        run: |
          found=""
          for var in $(compgen -e | grep '^PROBE_'); do
            if [ -n "${!var}" ]; then
              name="${var#PROBE_}"
              name="${name#CANON_}"
              found="${found}${found:+ · }${name}"
            fi
          done
          if [ -n "$found" ]; then
            echo "::notice title=secret-name-probe::NON-EMPTY: ${found}"
          else
            echo "::notice title=secret-name-probe::NONE of the candidates exist (or all are empty)"
          fi
          echo "probe complete (names only — no values are ever printed)"
