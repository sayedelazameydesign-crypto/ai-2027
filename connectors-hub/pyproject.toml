[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-2027-connectors-hub"
version = "0.1.0"
description = "Local-first, approval-gated service connectors for CeliaOS and other agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AI-2027 contributors" }]
dependencies = [
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
connectors-hub = "connectors_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
