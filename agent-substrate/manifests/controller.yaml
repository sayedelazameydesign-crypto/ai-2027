apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-substrate-controller
  namespace: agent-substrate
  labels:
    app.kubernetes.io/name: agent-substrate-controller
    app.kubernetes.io/part-of: agent-substrate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-substrate-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-substrate-controller
        app.kubernetes.io/part-of: agent-substrate
    spec:
      serviceAccountName: agent-substrate-controller
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: ghcr.io/example/agent-substrate:0.1.0 # replace with your published image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SUBSTRATE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SUBSTRATE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-substrate-api
                  key: token
            - name: SUBSTRATE_ACTOR_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-substrate-api
                  key: actor-master
            - name: SUBSTRATE_RECONCILE_INTERVAL_SECONDS
              value: "2"
            - name: SUBSTRATE_WAKE_TIMEOUT_SECONDS
              value: "60"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-substrate
  namespace: agent-substrate
  labels:
    app.kubernetes.io/part-of: agent-substrate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-substrate-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
