apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.substrate.ai
spec:
  group: substrate.ai
  scope: Namespaced
  names:
    plural: agents
    singular: agent
    kind: Agent
    shortNames: [agt]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: OCI image implementing the Agent Substrate HTTP contract.
                desiredState:
                  type: string
                  enum: [Running, Sleeping]
                  default: Running
                runtimeClassName:
                  type: string
                  maxLength: 63
                  default: gvisor
                  description: Must name an installed sandbox RuntimeClass, such as gVisor or Kata.
                workspaceStorage:
                  type: string
                  pattern: '^[1-9][0-9]*(Mi|Gi|Ti)$'
                  default: 1Gi
                idleTimeoutSeconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
                  default: 300
                  description: Zero disables automatic suspension.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Starting, Running, Sleeping, CheckpointFailed, Failed]
                podName:
                  type: string
                  maxLength: 63
                lastActivityTime:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                reason:
                  type: string
                  maxLength: 256
