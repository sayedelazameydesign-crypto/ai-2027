[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-2027"
version = "1.0.0"
description = "Shared, dependency-free reliability primitives for every AI-2027 engine"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools]
packages = ["kernel2027"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
